<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EEDF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>ととのい帳</title>
<style>
  /* 承認ビジュアルターゲット（Issue #24）準拠：和紙の帳・判子朱・金は達成のみ */
  :root{
    --bg:#F5EEDF; --paper:#FBF6EA; --paper2:#F3ECDA; --text:#4A3B2E; --mid:#6E5D4B; --muted:#A08C72;
    --line:#E4D9C0; --line2:#D3C5A4; --stamp:#C8402F; --stamp2:#D9483B; --gold:#C7973F; --ok:#6F9A63;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    font-size:15px;line-height:1.6;padding-bottom:132px}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px}
  header{padding:calc(16px + env(safe-area-inset-top)) 0 8px;text-align:center}
  h1{font-size:17px;font-weight:800;letter-spacing:.35em;color:var(--text)}
  h1 .yu{color:var(--stamp);letter-spacing:0}
  .edition{font-family:ui-monospace,monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;display:block;margin-top:2px}
  button{font-family:inherit;cursor:pointer}
  .btn{font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line2);
    background:var(--paper);color:var(--text)}
  .btn.primary{background:var(--stamp);color:#FBF6EA;border-color:var(--stamp);box-shadow:0 2px 0 rgba(74,59,46,.18)}
  .btn:disabled{opacity:.4}
  .notice{margin:10px 0 0;padding:10px 13px;border:1.5px solid var(--line);border-left:3px solid var(--ok);
    background:var(--paper);font-size:12.5px;line-height:1.7;color:var(--mid);border-radius:10px}
  .notice.err{border-left-color:var(--stamp)}
  /* ---------- 帳（パスポートページ） ---------- */
  /* 紙の造作は第4弾素材（book-skin）。レイヤー順はREADME準拠：
     綴じ(最前)→上端の紙層→下端の紙の重なり→右小口→和紙下地 */
  #book{background:var(--paper);border:1px solid var(--line2);border-radius:6px 14px 14px 6px;margin-top:10px;
    padding:24px 14px 30px 30px;position:relative;
    box-shadow:inset 12px 0 18px -14px rgba(74,59,46,.35), 0 2px 8px rgba(74,59,46,.12);
    background-image:url(art/binding-left.webp),url(art/page-edge-top.webp),url(art/page-stack-bottom.webp),url(art/page-fore-edge.webp),url(art/paper-page.webp);
    background-repeat:repeat-y,no-repeat,no-repeat,repeat-y,repeat;
    background-position:left top,top,bottom,right top,0 0;
    background-size:26px auto,100% 24px,100% 30px,12px 64px,256px 256px}
  .pageentry{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;background:none;border:none;width:100%;
    text-align:left;color:var(--text);padding:2px;border-bottom:1px dashed rgba(211,197,164,.55);position:relative}
  /* 金の栞：達成のあったページにだけ挟まる（1画面1本の原則はcalcShioriの粒度で担保） */
  .shiori{position:absolute;top:-15px;right:16px;width:30px;height:82px;z-index:1;pointer-events:none;
    background:url(art/ribbon-gold.webp) top center/100% auto no-repeat;
    writing-mode:vertical-rl;font-size:9px;font-weight:700;color:#6B4E15;letter-spacing:.16em;
    display:flex;justify-content:center;padding-top:12px;filter:drop-shadow(0 2px 3px rgba(74,59,46,.3))}
  .hero .shiori{top:-8px;right:20px}
  .pe-seal{flex-shrink:0}
  .pe-fn{font-size:10.5px;color:var(--mid);font-weight:700;letter-spacing:0}
  /* きょうの欄：行く前は空き枠、押すとここに大判が載る */
  .hero{display:block;width:100%;text-align:center;background:none;border:none;color:var(--text);font-family:inherit;padding:2px 0 12px;position:relative}
  .hero .hn{font-size:13.5px;font-weight:800;margin-top:1px}
  .hero .hrow{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:2px}
  .heroslot{text-align:center;padding:8px 0 16px}
  .heroring{width:128px;height:128px;margin:4px auto 10px;border:2.5px dashed #D3C5A4;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:36px;color:#D8C9A8;
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif}
  .heroslot p{font-size:10.5px;color:var(--muted);letter-spacing:.12em}
  /* 写真：ポラロイド枠＋マステ（第5弾素材。窓位置は polaroid-frame.webp の実測%） */
  .pol{position:relative;display:inline-block;width:238px;aspect-ratio:640/760;transform:rotate(-1deg);
    filter:drop-shadow(0 3px 5px rgba(74,59,46,.3))}
  .pol .win{position:absolute;left:13.9%;top:10.4%;width:71.9%;height:63.7%;overflow:hidden}
  .pol .win img{display:none;width:100%;height:100%;object-fit:cover}
  .pol::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:url(art/polaroid-frame.webp) center/100% 100% no-repeat}
  .pol::before{content:"";position:absolute;top:-11px;left:50%;width:112px;height:34px;margin-left:-56px;z-index:2;
    transform:rotate(-4deg);background:url(art/tape-washi-a.webp) center/100% 100% no-repeat}
  .pol.b::before{transform:rotate(3deg);background-image:url(art/tape-washi-b.webp);width:100px;margin-left:-50px}
  .pe-ph{display:none;width:46px;height:46px;object-fit:cover;flex-shrink:0;align-self:center;
    border:3px solid #FFFEF8;border-radius:2px;box-shadow:0 1px 4px rgba(74,59,46,.3);transform:rotate(2.5deg)}
  /* 常連の間：初回/前回/今回の三面鏡 */
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
  .tcard{background:var(--paper2);border:1.5px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;
    font-family:inherit;color:var(--text);min-width:0}
  .tlb{font-size:9px;color:var(--muted);letter-spacing:.2em}
  .td{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--mid);margin-top:1px}
  .tph{display:none;width:52px;height:52px;object-fit:cover;margin:5px auto 2px;border:3px solid #FFFEF8;
    border-radius:2px;box-shadow:0 1px 3px rgba(74,59,46,.3);transform:rotate(-2deg)}
  .tph.none{display:flex;align-items:center;justify-content:center;border:none;box-shadow:none;transform:none}
  .ts{font-size:13px;font-weight:800;margin-top:2px}
  .ts small{font-size:9px;color:var(--muted);font-weight:600}
  .ts.n{font-size:9.5px;color:var(--muted);font-weight:600}
  .tn{font-size:9.5px;color:var(--mid);line-height:1.5;margin-top:2px;overflow:hidden;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;text-align:left}
  .trio.duo{grid-template-columns:repeat(2,minmax(0,1fr))}
  .goblk{margin-top:9px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper2);padding:8px 12px}
  .roomdet{margin-top:9px;border:1.5px solid var(--line);border-radius:11px;background:var(--paper2);padding:8px 12px}
  .roomdet summary{font-size:11.5px;color:var(--mid);cursor:pointer;list-style:none;letter-spacing:.04em}
  .roomdet summary::-webkit-details-marker{display:none}
  .roomdet .arw{display:inline-block;font-size:9px;color:var(--muted);transition:transform .15s}
  .roomdet[open] .arw{transform:rotate(180deg)}
  .roomcard{border:1px solid var(--line2);border-radius:9px;background:var(--paper);padding:7px 11px}
  .goblk .gr{display:flex;gap:8px;font-size:12px;line-height:1.8;color:var(--mid)}
  .goblk .gl{flex-shrink:0;width:54px;font-size:10px;color:var(--muted);padding-top:3px;letter-spacing:.1em}
  .lcard{display:block;width:100%;background:var(--paper);border:1.5px solid var(--line2);border-radius:12px;
    padding:10px 12px;margin-top:8px;text-align:left;font-family:inherit;color:var(--text)}
  .vrow{display:flex;gap:7px;align-items:center;width:100%;background:none;border:none;text-align:left;
    border-bottom:1px dashed var(--line);padding:5px 2px;color:var(--mid);font-size:11.5px;font-family:inherit}
  .vrow .vd{font-size:10px;color:var(--muted);flex-shrink:0}
  .vrow .vn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vrow .vsc{color:var(--stamp);font-weight:700;font-family:ui-monospace,monospace;font-size:11px;flex-shrink:0}
  .vrow-ph{width:24px;height:24px;object-fit:cover;border-radius:3px;border:2px solid #FFFEF8;
    box-shadow:0 1px 2px rgba(74,59,46,.3);display:none;flex-shrink:0}
  .obstag{background:rgba(200,64,47,.08);border-color:rgba(200,64,47,.4);color:#B0483A;font-family:inherit;margin:0 4px 4px 0}
  .axbtn{background:none;border:1px solid var(--line2);border-radius:999px;font-size:9.5px;color:var(--muted);
    padding:2px 8px;margin-left:7px;font-family:inherit;vertical-align:1px}
  .pe-side{padding-top:8px;min-width:0}
  .pe-date{font-family:ui-monospace,monospace;font-size:11px;color:var(--mid);letter-spacing:.05em}
  .pe-score{font-size:16px;font-weight:800;color:var(--text)}
  .pe-score small{font-size:10px;font-weight:600;color:var(--muted)}
  .pe-score u{text-decoration:none;border-bottom:2px solid rgba(200,64,47,.5)}
  .pe-scorerow{display:flex;align-items:center;gap:6px}
  .pe-why{font-size:10px;color:var(--muted);line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pe-note{font-size:11.5px;color:var(--mid);margin-top:2px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pe-note.s{font-size:10.5px;-webkit-line-clamp:1}
  .pe-nth{display:inline-block;font-size:9px;color:var(--mid);border:none;
    background:url(art/visit-slip.webp) center/100% 100% no-repeat;
    padding:3px 12px 5px;margin-top:3px;letter-spacing:.15em}
  /* 最新ページ（今月）の右下だけに紙のめくれ */
  .pg{position:relative}
  .pg.cur::after{content:"";position:absolute;right:-14px;bottom:-14px;width:60px;height:60px;pointer-events:none;
    background:url(art/page-curl-latest.webp) bottom right/contain no-repeat}
  .pgdiv{border:none;height:16px;margin:14px -14px 14px -30px;
    background:url(art/page-peek.webp) center/100% 100% no-repeat}
  .empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:13px;line-height:2}
  /* 見本モード（R4）：メモリ上の別モデルを専用オーバーレイに描く。stateには一切触れない */
  #demo{position:fixed;inset:0;z-index:210;display:none;flex-direction:column;background:var(--bg)}
  #demo.on{display:flex}
  #demo .dbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--paper2);border-bottom:1.5px solid var(--line)}
  #demo .dbar b{font-size:11.5px;color:var(--mid);letter-spacing:.08em}
  #demo .dbar small{font-size:10px;color:var(--muted);margin-left:6px}
  #demo .dbar .dx{border:1px solid var(--line2);background:none;border-radius:999px;padding:4px 12px;font-size:11px;color:var(--mid)}
  #demo .dbody{flex:1;overflow-y:auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
  #demo .dstep{font-size:10px;color:var(--muted);letter-spacing:.15em}
  .dcard{position:relative;display:block;width:100%;text-align:center;background:var(--paper);border:1.5px solid var(--line);
    border-radius:13px;padding:14px 12px;font:inherit;color:inherit}
  .dcard.hot{border:2px dashed var(--stamp);cursor:pointer}
  .dguide{text-align:center;font-size:11.5px;color:var(--stamp);margin:10px 0 6px;letter-spacing:.1em}
  .dwm{position:absolute;top:6px;left:6px;background:rgba(74,59,46,.55);color:#FEF6E6;font-size:9px;
    padding:1px 6px;border-radius:4px;letter-spacing:.18em;z-index:2}
  .dphoto{position:relative;display:inline-block;max-width:78%;margin:8px auto 2px;border:5px solid #fff;
    border-bottom-width:16px;box-shadow:0 2px 7px rgba(74,59,46,.18);transform:rotate(-1.6deg)}
  .dphoto img{display:block;width:100%;height:auto}
  .drow{position:relative;display:flex;gap:12px;align-items:center;background:var(--paper);border:1.5px solid var(--line);
    border-radius:11px;padding:9px 12px;margin-top:9px;text-align:left}
  .dnth{font-size:9.5px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:6px}
  /* サマリー（帳の冒頭に小さく） */
  .stats{display:flex;gap:8px;margin-top:10px}
  .stats .st{flex:1;background:var(--paper);border:1.5px solid var(--line);border-radius:11px;padding:7px 4px;text-align:center}
  .stats b{font-family:ui-monospace,monospace;font-size:18px;display:block;line-height:1.25}
  .stats span{font-size:8.5px;color:var(--muted);letter-spacing:.1em}
  /* ---------- タブ・CTA ---------- */
  #ctabar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:center;pointer-events:none}
  #stampBtn{pointer-events:auto;min-width:250px;font-size:14.5px;font-weight:800;letter-spacing:.25em;padding:13px 26px;
    border-radius:999px;border:none;background:var(--stamp);color:#FBF6EA;box-shadow:0 3px 10px rgba(74,59,46,.3)}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);border-top:1.5px solid var(--line2);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;font-size:10.5px;color:var(--muted);padding:8px 0 7px;letter-spacing:.15em;line-height:1.5}
  nav button .ic{display:block;width:22px;height:22px;margin:0 auto 2px;background:currentColor;
    -webkit-mask:var(--ic) center/contain no-repeat;mask:var(--ic) center/contain no-repeat}
  nav button.on{color:var(--stamp);font-weight:700}
  .pane{display:none}.pane.on{display:block}
  /* ---------- 探す ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;font-size:12px;font-weight:600;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line2);
    background:var(--paper);color:var(--mid)}
  .chip.on{background:var(--stamp);border-color:var(--stamp);color:#FBF6EA}
  .mselrow{display:flex;gap:6px;margin-top:8px}
  .mselrow select{flex:1;min-width:0;background:var(--paper);border:1.5px solid var(--line2);border-radius:10px;
    color:var(--text);font:inherit;font-size:12px;padding:7px 8px;appearance:none;-webkit-appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  #mapbox{border:1.5px solid var(--line2);border-radius:14px;overflow:hidden;margin-top:8px;
    background:#FBF1DC url(art/map-paper.webp) repeat;background-size:256px 256px}
  .ft{display:inline-block;width:12px;height:12px;background:currentColor;vertical-align:-2px;
    -webkit-mask:var(--ft) center/contain no-repeat;mask:var(--ft) center/contain no-repeat}
  .chip .ft{margin-right:3px;vertical-align:-1.5px}
  #mapbox svg{width:100%;display:block;touch-action:none}
  .maptools{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px}
  .maplegend{font-size:9.5px;color:var(--muted);line-height:1.8}
  .frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    border-bottom:1.5px dashed var(--line);padding:10px 2px;color:var(--text);touch-action:pan-y}
  .frow .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .ct{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);flex-shrink:0;text-align:right;line-height:1.5}
  .attr{font-size:11px;letter-spacing:2px}
  .wantstar{color:var(--gold);font-size:12px;margin-left:3px}
  /* ---------- 棚 ---------- */
  .regbox{border:1.5px solid var(--line);border-radius:12px;margin-top:10px;background:var(--paper);overflow:hidden}
  .reghead{display:flex;width:100%;align-items:center;gap:9px;background:none;border:none;padding:11px 13px;
    font-size:13px;font-weight:700;color:var(--text)}
  .reghead .num{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
  .shelf{background:#EFE6D2 url(art/wood-back.webp) repeat;background-size:256px 256px;
    border-radius:0 0 11px 11px;padding:12px 10px 10px}
  .plank{height:11px;margin:4px -4px 14px;border-radius:2px;box-shadow:0 2px 3px rgba(74,59,46,.22);
    background:#C29055 url(art/wood-shelf.webp) repeat;background-size:256px 256px}
  .okirow{display:flex;justify-content:flex-end;align-items:flex-end;gap:14px;padding:0 12px;margin-bottom:-2px}
  .okirow img{display:block}
  .bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px;margin-bottom:0}
  .bcell{background:var(--paper);border:none;border-radius:8px;padding:6px 3px 4px;text-align:center;font-family:inherit;
    color:var(--text);min-width:0;box-shadow:0 2px 3px rgba(74,59,46,.2)}
  .bcell svg{width:100%;height:auto;display:block}
  .bnm{display:block;font-size:8px;color:var(--mid);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnm.off{color:#C9B58F}
  .cnt{position:relative}
  .cntb{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;border-radius:9px;border:1.2px solid var(--text);
    background:var(--paper);font-family:ui-monospace,monospace;font-size:10px;font-weight:700;line-height:14px;padding:0 2px}
  .cntb.g{border-color:var(--gold);color:var(--gold)}
  /* ---------- 記録 ---------- */
  .lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);
    border-radius:12px;padding:10px 13px;margin-top:9px;color:var(--text)}
  .lrow .d{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);flex-shrink:0}
  .lrow .nm{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .sc{font-family:ui-monospace,monospace;font-size:12px;color:var(--stamp);flex-shrink:0}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
  .sect{border-top:1.5px dashed var(--line2);margin-top:24px;padding-top:16px}
  .settext{font-size:12px;color:var(--mid);line-height:1.85;margin:8px 0 0}
  input[type=range]{width:100%;accent-color:var(--stamp)}
  .input{width:100%;font-family:inherit;font-size:14px;padding:10px 13px;border:1.5px solid var(--line2);border-radius:11px;
    background:var(--paper);color:var(--text)}
  /* ---------- シート ---------- */
  .overlay{position:fixed;inset:0;background:rgba(74,59,46,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.on{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
    padding:18px 18px calc(28px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;
    box-shadow:0 -6px 24px rgba(74,59,46,.2)}
  .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .xbtn{background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
  .backbtn{font-size:12px;color:var(--mid);background:none;border:none;font-weight:700;padding:4px 0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%;text-align:left}
  .badge{display:inline-block;font-size:10px;font-weight:700;color:var(--mid);border:1px solid var(--line2);
    border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
  .fbtnrow{display:flex;gap:8px;margin-top:12px}
  .fbtnrow .btn{flex:1;padding:11px 4px;font-size:12.5px}
  .mono{font-family:ui-monospace,monospace}
  .nth{writing-mode:vertical-rl;font-size:11px;letter-spacing:.3em;color:var(--mid);border:1px solid var(--line2);

  @keyframes stampout{to{opacity:0;transform:scale(0.96)}}
</style>

<script src="./catalog.js"></script>
<script>
"use strict";
const APP_VERSION = "2.0.0-alpha.21";

/* ---------- 施設マスタ（catalog.js が静的配信。アプリ本体と独立にカタログだけ版を上げられる） ---------- */
if(!window.CATALOG){
  document.body.innerHTML='<p style="font-family:sans-serif;padding:40px 20px;text-align:center">施設カタログ（catalog.js）を読み込めませんでした。通信環境を確認して再読み込みしてください。</p>';
  throw new Error("catalog.js not loaded");
}
const DATA = window.CATALOG;
const EDITION = DATA.edition;  /* 施設データの版（カタログ由来。470s/サ道場と共通） */
const FACILITIES = DATA.FACILITIES, PREF = DATA.PREF, REGIONS = DATA.REGIONS, SHAPES = DATA.SHAPES;

/* ---------- 基本 ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rad=d=>d*Math.PI/180;
function distance(a,b){
  const R=6371000, dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const today=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r1=v=>Math.round(v*10)/10;
const fmt1=v=>r1(v).toFixed(1);

/* ---------- 状態 totonoi:v1 ----------
   visits: [{id, fid, date, sc:{s:[5軸],x,why,v:2}|null, paid|null, note}] 新しい順
   wants: {fid:date}  ufacs: [{id:"u..",name,lat,lng,u:1}] */
const KEY="totonoi:v1";
let state={visits:[], wants:{}, ufacs:[], radius:300, imported:{}};
try{ const raw=localStorage.getItem(KEY); if(raw) state=Object.assign(state,JSON.parse(raw)); }catch(e){}
if(!Array.isArray(state.visits)) state.visits=[];
if(!state.wants) state.wants={};
if(!Array.isArray(state.ufacs)) state.ufacs=[];
if(!state.imported) state.imported={};
if(!state.shioriSeen) state.shioriSeen={};
if(!state.obs) state.obs={};  /* 観測層：{fid:{tags:[],memo,at}} スキーマv2 §5の第一歩 */
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ notify("保存に失敗しました。","err"); } };
let byId={};
function reindex(){ byId=Object.fromEntries(FACILITIES.concat(state.ufacs).map(f=>[f.id,f])); }
reindex();
const visitsOf=fid=>state.visits.filter(v=>v.fid===fid);
const visited=fid=>visitsOf(fid).length>0;
const nthOf=v=>{ const a=visitsOf(v.fid); return a.length-a.indexOf(v); };  /* visitsは新しい順 */
const scoreTotal=sc=>r1(sc.s.reduce((a,b)=>a+(b||0),0)+(sc.x||0));
const AXES=["サウナ室","水風呂","外気浴・休憩","清潔・雰囲気","導線"];

/* ---------- 御朱印（自動生成判子。サ道場facSealの後継） ---------- */
const sealHash=s=>{ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h; };
/* ---------- 観測ログ（R2a）：1レコード=1部屋1観測 {room:"s1"/"w1"…, temp, at, vid}。
   履歴で積み、表示・判子は部屋ごとの最新値を採用（自分の帳では観測が勝つ。要件定義§10.3） ---------- */
function obsLog(fid){ const o=state.obs[fid]||(state.obs[fid]={tags:[],memo:""}); return o.ol||(o.ol=[]); }
function obsLatestByRoom(fid){
  const m={};
  for(const r of ((state.obs[fid]||{}).ol||[])) m[r.room]=r;  /* olは追記順＝後勝ち */
  return m;
}
function obsTemps(fid,i){
  const pre=i===0?"s":"w", m=obsLatestByRoom(fid);
  return Object.keys(m).filter(k=>k[0]===pre).sort().map(k=>m[k].temp);
}
/* 旧形式（obs.ax[i].temps=施設単位の温度配列・alpha.17）→ ol へ移行。カタログの部屋idへ順に割当て。冪等 */
function migrateObs(){
  let ch=false;
  for(const fid of Object.keys(state.obs||{})){
    const o=state.obs[fid]; if(!o||!o.ax) continue;
    [0,1].forEach(i=>{
      const t=(o.ax[i]||{}).temps; if(!t||!t.length) return;
      const pre=i===0?"s":"w";
      const rooms=((byId[fid]||{})[i===0?"saunas":"waters"]||[]).map(r=>r.id);
      t.forEach((v,j)=>obsLog(fid).push({room:rooms[j]||pre+(j+1),temp:v,at:o.at||today(),vid:null}));
      delete o.ax[i].temps; ch=true;
    });
  }
  if(ch) save();
}
/* GPS押印が成れば、その施設の座標は現地で検証されたことになる（スキーマv2 geo検証の自動化） */
function geoVerify(fid){ const o=state.obs[fid]||(state.obs[fid]={tags:[],memo:""}); o.geo={ok:1,at:today()}; }
function sealBadges(f){
  const st=obsTemps(f.id,0), wt=obsTemps(f.id,1);
  const smax=st.length?Math.max(...st):f.smax;
  const wmin=wt.length?Math.min(...wt):f.wmin;
  const b=[];
  if(smax!=null&&(smax>=110||(smax>=100&&st.length>=2))) b.push("flame2");
  else if(smax!=null&&smax>=100) b.push("flame");
  if(wmin!=null&&wmin<10) b.push("snow");
  if(f.n) b.push("moon");
  if(f.y) b.push("key");
  if(f.fee!=null&&f.fee>=3000) b.push("koban");
  return b;
}
function facSeal(f,o={}){
  const gold=o.gold, ink=o.ink||(gold?"#C7973F":"#C8402F");
  const h=sealHash(f.id), rot=(h%9)-4;
  const attr=o.size?`width="${o.size}" height="${o.size}"`:"";
  let frame;
  if(f.k==="private"||f.k==="capsule")
    frame=`<rect x="-34" y="-34" width="68" height="68" rx="6" fill="none" stroke="${ink}" stroke-width="4.5"/><rect x="-28" y="-28" width="56" height="56" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  else if(f.k==="hotel")
    frame=`<polygon points="0,-37 32,-18.5 32,18.5 0,37 -32,18.5 -32,-18.5" fill="none" stroke="${ink}" stroke-width="4.5"/><polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  else if(f.k==="camp")
    frame=`<polygon points="0,-38 36,-10 23,36 -23,36 -36,-10" fill="none" stroke="${ink}" stroke-width="4.5"/><polygon points="0,-31 29,-8 18.5,29 -18.5,29 -29,-8" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  else
    frame=`<circle r="36" fill="none" stroke="${ink}" stroke-width="4.5"/><circle r="30" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  if(o.hidden)
    return `<svg viewBox="-45 -45 90 90" ${attr}><g opacity="0.4">${frame.replaceAll(ink,"#C9B58F")}<text y="10" text-anchor="middle" font-size="26" fill="#C9B58F" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">？</text></g></svg>`;
  const ch=(f.name||"").replace(/[ 　]/g,"")[0]||"湯";
  const badge=(t,x,y,s)=>{
    const g=v=>`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s})">${v}</g>`;
    if(t==="flame") return g(`<path d="M0,-7 C3,-3 5,-1 5,2 C5,5.5 2.8,8 0,8 C-2.8,8 -5,5.5 -5,2 C-5,0 -4,-2 -2.5,-3.5 C-2.5,-1.5 -1,-0.5 0,-1 C-1,-3.5 -0.5,-5 0,-7Z" fill="${ink}"/>`);
    if(t==="flame2") return g(`<path transform="translate(-3.2,1) scale(0.72)" d="M0,-7 C3,-3 5,-1 5,2 C5,5.5 2.8,8 0,8 C-2.8,8 -5,5.5 -5,2 C-5,0 -4,-2 -2.5,-3.5 C-2.5,-1.5 -1,-0.5 0,-1 C-1,-3.5 -0.5,-5 0,-7Z" fill="${ink}"/><path transform="translate(2.6,0)" d="M0,-7 C3,-3 5,-1 5,2 C5,5.5 2.8,8 0,8 C-2.8,8 -5,5.5 -5,2 C-5,0 -4,-2 -2.5,-3.5 C-2.5,-1.5 -1,-0.5 0,-1 C-1,-3.5 -0.5,-5 0,-7Z" fill="${ink}"/>`);
    if(t==="snow") return g(`<g stroke="${ink}" stroke-width="1.7" stroke-linecap="round"><line y1="-6.5" y2="6.5"/><line x1="-5.6" y1="-3.2" x2="5.6" y2="3.2"/><line x1="-5.6" y1="3.2" x2="5.6" y2="-3.2"/></g>`);
    if(t==="moon") return g(`<path d="M2,-7 A7,7 0 1,0 2,7 A5.5,5.5 0 1,1 2,-7Z" fill="${ink}"/>`);
    if(t==="key") return g(`<circle r="3.2" cy="-2.5" fill="none" stroke="${ink}" stroke-width="1.7"/><rect x="-1" y="0.2" width="2" height="6.6" fill="${ink}"/><rect x="0.8" y="4" width="2.4" height="1.6" fill="${ink}"/>`);
    if(t==="koban") return g(`<ellipse rx="4.6" ry="6.4" fill="none" stroke="${ink}" stroke-width="1.8"/><line x1="-2" x2="2" stroke="${ink}" stroke-width="1.6"/>`);
    return "";
  };
  const bad=sealBadges(f);
  let bx="", chY=12, chFs=34;
  if(bad.length){
    chY=6; chFs=bad.length>=3?27:30;
    if(bad.length<=2) bx=bad.map((t,i)=>badge(t,(i-(bad.length-1)/2)*13,20,1)).join("");
    else bx=bad.map((t,i)=>{
      const a=(90+(i-(bad.length-1)/2)*24)*Math.PI/180;
      return badge(t,23.5*Math.cos(a),23.5*Math.sin(a)+0.5,0.8);
    }).join("");
  }
  const city=f.city?`<text y="-16" text-anchor="middle" font-size="${f.city.length>5?5.4:6.8}" letter-spacing="0.8" fill="${ink}">${esc(f.city)}</text>`:"";
  const body=`<g transform="rotate(${o.rot!=null?o.rot:rot})">${frame}${city}
    <text y="${chY}" text-anchor="middle" font-size="${chFs}" font-weight="800" fill="${ink}" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">${esc(ch)}</text>
    ${bx}</g>`;
  if(o.bodyOnly) return body;
  return `<svg viewBox="-45 -45 90 90" ${attr}><g filter="url(#sealtex)" opacity="${o.faint?0.32:(o.op!=null?o.op:0.9)}">${body}</g></svg>`;
}

/* ---------- 通知 ---------- */
let ntfT;
function notify(msg,kind){
  const el=document.getElementById("notice");
  el.className="notice"+(kind==="err"?" err":""); el.textContent=msg; el.style.display="block";
  clearTimeout(ntfT); ntfT=setTimeout(()=>el.style.display="none",5000);
}

/* ---------- シート ---------- */
const overlay=document.getElementById("overlay"), sheetEl=document.getElementById("sheet");
const openSheet=h=>{ sheetEl.innerHTML=h; overlay.classList.add("on"); sheetEl.scrollTop=0; document.body.style.overflow="hidden"; };
const closeSheet=()=>{ overlay.classList.remove("on"); document.body.style.overflow=""; };
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeSheet(); });
window.__close=closeSheet;
const sheetHead=(t,back)=>`<div class="shead">${back||`<span class="eyebrow">${esc(t)}</span>`}<button class="xbtn" onclick="window.__close()">×</button></div>`;

/* ---------- 栞（達成リワード） ----------
   原則：進捗を先に見せない。達成した瞬間に祝い、帳のそのページに金の栞が挟まる。
   対象＝県制覇（その県の470枠を全訪問）→地方制覇→全国。判定は枠（f.rank持ち）のみ */
function calcShiori(){
  const first={};  /* fid→最初の訪問（古い側から走査） */
  for(let i=state.visits.length-1;i>=0;i--){ const v=state.visits[i]; if(!first[v.fid]) first[v.fid]=v; }
  const out=[], doneP={};
  for(const pk in PREF){
    const fr=FACILITIES.filter(f=>f.pref===pk&&f.rank);
    if(!fr.length||!fr.every(f=>first[f.id])) continue;
    let lastV=null;
    for(const f of fr){ const fv=first[f.id]; if(!lastV||fv.date>lastV.date) lastV=fv; }
    doneP[pk]={at:lastV.date,vid:lastV.id};
    out.push({id:"p:"+pk, label:PREF[pk].label+"を制覇", short:PREF[pk].short||PREF[pk].label, at:lastV.date, vid:lastV.id});
  }
  for(const [rn,keys] of REGIONS){
    const ks=keys.filter(k=>PREF[k]);
    if(!ks.length||!ks.every(k=>doneP[k])) continue;
    const last=ks.map(k=>doneP[k]).reduce((a,b)=>a.at>b.at?a:b);
    out.push({id:"r:"+rn, label:rn+"を制覇", short:rn.slice(0,2), at:last.at, vid:last.vid});
  }
  if(Object.keys(doneP).length===Object.keys(PREF).length&&out.length){
    const last=Object.values(doneP).reduce((a,b)=>a.at>b.at?a:b);
    out.push({id:"all", label:"全国470枠を踏破", short:"全国", at:last.at, vid:last.vid});
  }
  return out;
}
function checkShiori(){
  const got=calcShiori().filter(s=>!state.shioriSeen[s.id]);
  if(!got.length) return;
  got.forEach(s=>state.shioriSeen[s.id]=1); save();
  openSheet(sheetHead("")+`
    <div style="text-align:center;padding:12px 0 6px">
      <svg viewBox="-50 -50 100 100" width="130" height="130"><g filter="url(#sealtex)" opacity="0.92">
        <circle r="42" fill="none" stroke="#C7973F" stroke-width="5"/><circle r="35" fill="none" stroke="#C7973F" stroke-width="1.5"/>
        <text y="14" text-anchor="middle" font-size="40" font-weight="800" fill="#C7973F" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">制</text>
      </g></svg>

/* 5軸のミニレーダー（サ室/水風呂/外気浴/清潔/導線）。走り書きの五角形＋各項目の点数 */
function radarSVG(sc,size){
  const pt=(r,i)=>{const a=(-90+i*72)*Math.PI/180;return `${(r*Math.cos(a)).toFixed(1)},${(r*Math.sin(a)).toFixed(1)}`};
  const ring=r=>Array.from({length:5},(_,i)=>pt(r,i)).join(" ");
  const val=Array.from({length:5},(_,i)=>pt(28*Math.max(0.08,((sc.s[i]||0))/5),i)).join(" ");
  const lb=["サ","水","外","清","導"].map((t,i)=>{
    const a=(-90+i*72)*Math.PI/180;
    return `<text x="${(40*Math.cos(a)).toFixed(1)}" y="${(40*Math.sin(a)+3).toFixed(1)}" text-anchor="middle" font-size="9" fill="#8A7358">${t}<tspan fill="#B0483A" font-weight="700">${fmt1(sc.s[i]||0)}</tspan></text>`;
  }).join("");
  return `<svg viewBox="-52 -52 104 104" width="${size}" height="${size}" style="flex-shrink:0">
    <polygon points="${ring(28)}" fill="none" stroke="#DCCFB2" stroke-width="1"/>
    <polygon points="${ring(14)}" fill="none" stroke="#E7DCC4" stroke-width="0.8"/>
    <polygon points="${val}" fill="rgba(200,64,47,.15)" stroke="rgba(200,64,47,.65)" stroke-width="1.7" stroke-linejoin="round"/>
    ${lb}</svg>`;
}
/* 総合点の星（0.5刻み）。90点以上=5つ星、80=4、70=3…＝(点-40)/10 を0.5に丸める */
function starsSVG(total,h=13){
  const s=Math.max(0,Math.min(5,Math.round((total-40)/5)/2));
  const star="M0,-5.2 L1.55,-1.6 5.1,-1.6 2.3,0.9 3.3,4.7 0,2.5 -3.3,4.7 -2.3,0.9 -5.1,-1.6 -1.55,-1.6Z";
  let out=`<svg viewBox="0 0 62 12" width="${(h/12*62).toFixed(0)}" height="${h}" style="vertical-align:-2px">
    <defs><clipPath id="halfstar"><rect x="-6" y="-6" width="6" height="12"/></clipPath></defs>`;
  for(let i=0;i<5;i++){
    const full=s>=i+1, half=!full&&s>=i+0.5;
    out+=`<g transform="translate(${6+i*12.5},6)"><path d="${star}" fill="${full?"#C7973F":"none"}" stroke="#C7973F" stroke-width="1"/>`;
    if(half) out+=`<path d="${star}" fill="#C7973F" clip-path="url(#halfstar)"/>`;
    out+=`</g>`;
  }
  return out+"</svg>";
}

    ${f.fee!=null?`<div class="spec"><b>¥${f.fee.toLocaleString()}〜</b><span>料金</span></div>`:""}

  const goRows=[["営業時間",f.hours],["定休日",f.off],["注記",f.note]].filter(([,v])=>v);

  /* B2. 部屋別データ（カタログ第2版〜）：見出しは数だけ、展開で1室1カード縦積み。旧カタログでは出ない。
     カード内は公式と私の実測を2行に分ける（R2a・観測の部屋紐付け） */
  const BATH_LABEL={m:"男湯",w:"女湯",mw:"共用"};

  const sn=(f.saunas||[]).length, wn=(f.waters||[]).length;
  const roomCard=(r,kind,col)=>`<div class="roomcard">

  </div>`;
  const roomHead=[sn?`サウナ室 ${sn}`:null,wn?`水風呂 ${wn}`:null,
    f.rest&&f.rest.outdoor===true?"外気浴あり":(f.rest&&f.rest.outdoor===false?"外気浴なし":null)].filter(Boolean).join("・");
  const roomblk=(sn||wn)?`<details class="roomdet"><summary>${roomHead}　<span class="arw">▼</span></summary>

    <p class="settext" style="margin-top:6px;font-size:9.5px">公式データ（${esc(EDITION)}時点）。あなたの実測は採点シートの🏷から観測に残せます</p>

  const todayV=vs.find(v=>v.date===today());

    </div>`;
  /* D. わたしの最新記録：1回目から必ず大判で出す。未採点でもひとこと・写真は独立表示 */

  const latestCard=total?`<div class="sect" style="margin-top:15px;padding-top:12px"><div class="eyebrow">わたしの最新記録${total>=2?`　${nthOf(latest)}回目`:""}</div>

        <div style="flex:1;min-width:0">

  /* E. 常連の間（再訪から現れて育つ） */
  const chrono=vs.slice().reverse();

    const vals=scored.map(v=>scoreTotal(v.sc)*4);

window.__obsAxDel=(fid,i,j)=>{

window.__udel=fid=>{

const AX_PRESET=[
  ["薪ストーブ","セルフロウリュ","オートロウリュ","塩サウナ","スチーム","2室ある","TVなし","暗め"],

function axObs(fid,i){
  const o=state.obs[fid]||(state.obs[fid]={tags:[],memo:""});

}
window.__axTag=(fid,i,btn)=>{

window.__axTagAdd=(fid,i)=>{

  if(!t) return;

/* 実測温度（サ室・水風呂のみ）。カンマ区切りで複数室。観測層に即保存し、判子の勲章が育つ */
window.__axTemp=(fid,i,vid)=>{
  const inp=document.getElementById("axtemp"+i); if(!inp) return;
  const ts=(inp.value||"").split(/[,、，\s\/]+/).map(s=>parseFloat(s))
    .filter(t=>isFinite(t)&&t>-30&&t<150).map(t=>Math.round(t*10)/10);
  const pre=i===0?"s":"w", td=today();
  const rooms=((byId[fid]||{})[i===0?"saunas":"waters"]||[]).map(r=>r.id);
  const ol=obsLog(fid);
  /* 同じ日の同じ部屋は置き換え（書き直しでログが膨れない）。カンマ順=部屋の並び（s1,s2…）に割当て */
  for(let k=ol.length-1;k>=0;k--) if(ol[k].room[0]===pre&&ol[k].at===td) ol.splice(k,1);
  ts.forEach((v,j)=>ol.push({room:rooms[j]||pre+(j+1),temp:v,at:td,vid:vid||null}));
  state.obs[fid].at=td; save();
  inp.value=ts.join(",");
  notify(ts.length?`${i===0?"サ室":"水風呂"}の実測 ${ts.join("・")}°C を観測に保存しました`:"きょうの実測温度を消しました");
};

function chipPass(f){ for(const [k,,fn] of CHIPS) if(chipOn.has(k)&&!fn(f)) return false; return true; }
function regKeys(name){ const r=REGIONS.find(r=>r[0]===name); return r?r[1]:[]; }

/* ---------- 地図（470s方式：全国SHAPES・pointerup判定・ズーム再描画） ---------- */
let view=null, mapMoved=false, renderedW=0, mapInit=false, mapPins=[], mapFocus=null;
const _bbox={};
function prefBBox(key){
  if(_bbox[key]) return _bbox[key];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const m of SHAPES.prefs[key].matchAll(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g)){
    const x=+m[1], y=+m[2];
    if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
  }
  return _bbox[key]={x0,y0,x1,y1};
}
function zoomTo(keys){
  const {W,H}=SHAPES.meta;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const k of keys){
    if(!SHAPES.prefs[k]) continue;
    const b=prefBBox(k);
    x0=Math.min(x0,b.x0); y0=Math.min(y0,b.y0); x1=Math.max(x1,b.x1); y1=Math.max(y1,b.y1);
  }
  if(x1<x0){ view=null; renderMap(); return; }
  let w=(x1-x0)*1.24, h=(y1-y0)*1.24;
  if(w/h>W/H) h=w*H/W; else w=h*W/H;
  w=Math.min(Math.max(w,W/64),W); h=w*H/W;
  view={x:(x0+x1)/2-w/2, y:(y0+y1)/2-h/2, w, h};
  renderMap();
}
const _anchor={};
function prefAnchor(key){
  if(_anchor[key]) return _anchor[key];
  let best=null;
  for(const sub of SHAPES.prefs[key].split("M").slice(1)){
    const pts=[...sub.matchAll(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g)].map(m=>[+m[1],+m[2]]);
    if(pts.length<3) continue;
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys));
    if(!best||area>best.area) best={area,x:xs.reduce((a,b)=>a+b,0)/xs.length,y:ys.reduce((a,b)=>a+b,0)/ys.length};
  }
  return _anchor[key]=best||{x:-999,y:-999};
}
function renderMap(){
  if(!mapInit) return;
  const {minLng,maxLng,minLat,maxLat,W,H,pad,okiS,okiAx,okiAy,okiBox,okiMaxLng,okiMaxLat}=SHAPES.meta;
  if(mapFocus){  /* 施設ページ「探すタブで見る」からのフォーカス */
    const k0=Math.cos(rad((minLat+maxLat)/2));
    const sX=(maxLng-minLng)*k0, sY=maxLat-minLat;
    let fx=pad+((mapFocus.lng-minLng)*k0)/sX*(W-pad*2);
    let fy=pad+(maxLat-mapFocus.lat)/sY*(H-pad*2);
    if(mapFocus.lng<okiMaxLng&&mapFocus.lat<okiMaxLat){ fx=fx*okiS+okiAx; fy=fy*okiS+okiAy; }
    const fw=W/24, fh=fw*H/W;
    view={x:fx-fw/2,y:fy-fh/2,w:fw,h:fh};
    mapFocus=null;
  }
  if(!view) view={x:0,y:0,w:W,h:H};
  const zf=view.w/W; renderedW=view.w;
  const k=Math.cos(rad((minLat+maxLat)/2));
  const spanX=(maxLng-minLng)*k, spanY=maxLat-minLat;
  const inOki=f=>f.lng<okiMaxLng&&f.lat<okiMaxLat;
  const px=f=>{const x=pad+((f.lng-minLng)*k)/spanX*(W-pad*2);return inOki(f)?x*okiS+okiAx:x;};
  const py=f=>{const y=pad+(maxLat-f.lat)/spanY*(H-pad*2);return inOki(f)?y*okiS+okiAy:y;};
  const zoom=W/view.w;
  const mk=Math.min(3.3, 1.45*Math.pow(zoom,0.4));
  const z=v=>+(v*zf).toFixed(2), zm=v=>+(v*zf*mk).toFixed(2);
  mapPins=[];
  let s=`<svg id="mapsvg" viewBox="${view.x} ${view.y} ${view.w} ${view.h}">`;
  s+=`<defs><pattern id="mgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#EDDFC3" stroke-width="0.6"/></pattern></defs>`;
  /* 下地の紙はSVGでなく#mapboxのCSS背景（art/map-paper.webp）。ズームしても紙目が一定＝印刷された紙を覗く感覚 */
  s+=`<rect x="${-W}" y="${-H}" width="${W*3}" height="${H*3}" fill="url(#mgrid)"/>`;
  for(const key in SHAPES.prefs){
    const p=PREF[key];
    const n=FACILITIES.filter(f=>f.pref===key&&visited(f.id)).length;
    s+=`<path d="${SHAPES.prefs[key]}" fill="${p?p.color:"#C7A876"}" fill-opacity="${(0.13+n*0.012).toFixed(3)}" stroke="#8A7358" stroke-width="0.7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  s+=`<path d="${SHAPES.biwa}" fill="#C6DCDF" stroke="#8FB0B6" stroke-width="0.6" vector-effect="non-scaling-stroke"/>`;
  if(zf<=0.55){
    const fs=8*zf, inView=c=>c.x>=view.x&&c.x<=view.x+view.w&&c.y>=view.y&&c.y<=view.y+view.h;
    for(const key in SHAPES.prefs){
      const p=PREF[key]; if(!p) continue;
      const c=prefAnchor(key); if(!inView(c)) continue;
      s+=`<text x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}" text-anchor="middle" font-size="${fs.toFixed(2)}" letter-spacing="${(fs*0.24).toFixed(2)}" fill="#A08C72">${p.label}</text>`;
    }
  }
  if(lastPos){
    const x=px(lastPos), y=py(lastPos);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z(3)}" fill="none" stroke="#6F9A63" stroke-width="${z(1)}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z(1.2)}" fill="#6F9A63"/>`;
  }
  for(const f of state.ufacs){
    const on=visited(f.id), x=px(f), y=py(f);
    mapPins.push({id:f.id,x,y});
    s+=`<g style="cursor:pointer">`;
    s+= on?`<rect x="${(x-zm(2.6)).toFixed(1)}" y="${(y-zm(2.6)).toFixed(1)}" width="${zm(5.2)}" height="${zm(5.2)}" rx="${zm(0.7)}" fill="#C8402F" transform="rotate(-8 ${x.toFixed(1)} ${y.toFixed(1)})"/>`
          :`<rect x="${(x-zm(2.2)).toFixed(1)}" y="${(y-zm(2.2)).toFixed(1)}" width="${zm(4.4)}" height="${zm(4.4)}" fill="#FFFDF4" stroke="#A69374" stroke-width="${zm(1)}"/>`;
    s+=`</g>`;
  }
  const pass=f=>(chipOn.size===0||chipPass(f))&&areaPass(f);
  for(const f of FACILITIES){
    if(!pass(f)) continue;
    const on=visited(f.id), want=!!state.wants[f.id], x=px(f), y=py(f);
    const col=PREF[f.pref]?.color||"#A69374";
    mapPins.push({id:f.id,x,y});
    s+=`<g style="cursor:pointer">`;
    s+= on
      ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${zm(3.6)}" fill="#C8402F"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${zm(2.2)}" fill="none" stroke="#FBF6EA" stroke-width="${zm(0.5)}"/>`
      : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${zm(2.6)}" fill="${want?"#FFF6DF":"#FFFDF4"}" stroke="${want?"#C7973F":col}" stroke-width="${zm(want?1.3:1)}"/>`;
    s+=`</g>`;
  }
  s+=`</svg>`;
  document.getElementById("mapbox").innerHTML=s;
  bindMapGestures(document.getElementById("mapsvg"));
}
function bindMapGestures(svg){
  const {W,H}=SHAPES.meta;
  const ptrs=new Map();
  let start=null;
  const apply=()=>svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
  const clamp=()=>{
    view.w=Math.min(Math.max(view.w,W/64),W); view.h=view.w*H/W;
    view.x=Math.min(Math.max(view.x,-view.w*0.2),W-view.w*0.8);
    view.y=Math.min(Math.max(view.y,-view.h*0.2),H-view.h*0.8);
  };
  const toLocal=e=>{
    const r=svg.getBoundingClientRect();
    return { x:view.x+(e.clientX-r.left)/r.width*view.w, y:view.y+(e.clientY-r.top)/r.height*view.h, cx:e.clientX, cy:e.clientY };
  };
  svg.addEventListener("pointerdown",e=>{
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,toLocal(e));
    start={...view}; mapMoved=false;
  });
  svg.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId)) return;
    const cur=toLocal(e);
    if(ptrs.size===1){
      const p0=[...ptrs.values()][0];
      const dx=(cur.cx-p0.cx), dy=(cur.cy-p0.cy);
      if(Math.abs(dx)+Math.abs(dy)>6) mapMoved=true;
      const r=svg.getBoundingClientRect();
      view.x=start.x-dx/r.width*view.w; view.y=start.y-dy/r.height*view.h;
      clamp(); apply();
    } else if(ptrs.size===2){
      mapMoved=true;
      const ids=[...ptrs.keys()];
      const other=ptrs.get(ids[0]===e.pointerId?ids[1]:ids[0]);
      const prev=ptrs.get(e.pointerId);
      const dPrev=Math.hypot(prev.cx-other.cx, prev.cy-other.cy)||1;
      const dCur=Math.hypot(cur.cx-other.cx, cur.cy-other.cy)||1;
      const sc=dPrev/dCur;
      const midx=(cur.x+other.x)/2, midy=(cur.y+other.y)/2;
      view.w*=sc; view.h*=sc;
      view.x=midx-(midx-view.x)*sc; view.y=midy-(midy-view.y)*sc;
      clamp(); apply();
      ptrs.set(e.pointerId,cur);
    }
  });
  const up=e=>{
    const wasSingle = ptrs.size===1;
    ptrs.delete(e.pointerId);
    if(wasSingle && !mapMoved) pickPin(e,svg);
    if(ptrs.size===0 && Math.abs(view.w-renderedW)>0.5) setTimeout(()=>renderMap(),0);
    setTimeout(()=>{mapMoved=false;},50);
  };
  svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
  let wheelT=null;
  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const cur=toLocal(e); const sc=e.deltaY>0?1.15:0.87;
    view.w*=sc; view.h*=sc;
    view.x=cur.x-(cur.x-view.x)*sc; view.y=cur.y-(cur.y-view.y)*sc;
    clamp(); apply();
    clearTimeout(wheelT);
    wheelT=setTimeout(()=>{ if(Math.abs(view.w-renderedW)>0.5) renderMap(); },160);
  },{passive:false});
}
/* タップは描画順ではなく「タップ点に最も近いピン」を数学的に選ぶ。指の範囲に複数あれば候補から選ばせる */
function pickPin(e,svg){
  const r=svg.getBoundingClientRect(), sc=r.width/view.w;
  const lx=view.x+(e.clientX-r.left)/r.width*view.w;
  const ly=view.y+(e.clientY-r.top)/r.height*view.h;
  const cand=mapPins.map(p=>({p,d:Math.hypot(p.x-lx,p.y-ly)*sc})).filter(o=>o.d<=20).sort((a,b)=>a.d-b.d);
  if(!cand.length) return;
  if(cand.length===1||(cand[0].d<6&&cand[1].d>cand[0].d*2.5)){ openFac(cand[0].p.id); return; }
  openSheet(sheetHead("どの施設？")+cand.slice(0,7).map(o=>{
    const f=byId[o.p.id]; if(!f) return "";
    return `<button class="choosebtn" onclick="window.__fac('${f.id}')"><span>${visited(f.id)?"●":"○"} ${esc(f.name)}</span><span class="d">${esc(f.city||"")}</span></button>`;
  }).join(""));
}

        }

      }

/* ---------- 写真（IndexedDB totonoi/photos。1訪問=1枚、1280px JPEG圧縮） ---------- */
let _idb=null;
function pdb(){ return new Promise((res,rej)=>{ if(_idb) return res(_idb);
  const r=indexedDB.open("totonoi",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("photos");
  r.onsuccess=()=>{ _idb=r.result; res(_idb); };
  r.onerror=()=>rej(r.error); }); }
const photoPut=(vid,blob)=>pdb().then(d=>new Promise((res,rej)=>{ const t=d.transaction("photos","readwrite"); t.objectStore("photos").put(blob,vid); t.oncomplete=res; t.onerror=()=>rej(t.error); }));
const photoGet=vid=>pdb().then(d=>new Promise(res=>{ const q=d.transaction("photos").objectStore("photos").get(vid); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); })).catch(()=>null);
const photoDel=vid=>pdb().then(d=>new Promise(res=>{ const t=d.transaction("photos","readwrite"); t.objectStore("photos").delete(vid); t.oncomplete=res; t.onerror=res; })).catch(()=>{});
const photoKeys=()=>pdb().then(d=>new Promise(res=>{ const q=d.transaction("photos").objectStore("photos").getAllKeys(); q.onsuccess=()=>res(q.result); q.onerror=()=>res([]); })).catch(()=>[]);
function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{ try{
      const M=1280; let w=img.naturalWidth,h=img.naturalHeight;
      const s=Math.min(1,M/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(img.src);
      c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",0.82);
    }catch(e){ rej(e); } };
    img.onerror=()=>rej(new Error("img"));
    img.src=URL.createObjectURL(file);
  });
}

   写真アーカイブは写真実装時に「データJSON＋無圧縮ZIP」の分離形式で追加する——JSONに写真は同梱しない */

    :`まだ一度も書き出していません。記録はこの端末の中だけにあります——<b>端末変更やアイコン削除で消えます</b>。iCloud Drive等へ書き出しておくと安全です。`;
}

/* ---------- 写真バックアップ（無圧縮ZIP・分離形式） ----------
   データJSONに写真は同梱しない（分析レポートR4）。<訪問id>.jpg を store方式ZIPに詰めるだけの
   単純なコンテナ。JPEGは圧縮済みなので無圧縮が正しい */
const CRC_T=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c; }
  return t; })();
const crc32=u8=>{ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
async function bkPhotosExport(){
  const keys=await photoKeys();
  if(!keys.length){ notify("写真がまだありません。"); return; }
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=v=>new Uint8Array([v&255,(v>>8)&255]);
  const u32=v=>new Uint8Array([v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255]);
  for(const k of keys){
    const blob=await photoGet(k); if(!blob) continue;
    const data=new Uint8Array(await blob.arrayBuffer());
    const name=enc.encode(String(k)+".jpg"), crc=crc32(data);
    const head=[new Uint8Array([80,75,3,4]),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name];
    central.push({name,crc,size:data.length,off});
    for(const p of head){ parts.push(p); off+=p.length; }
    parts.push(data); off+=data.length;
  }
  const cdStart=off; let cdLen=0;
  for(const c of central){
    const e=[new Uint8Array([80,75,1,2]),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(c.crc),u32(c.size),u32(c.size),u16(c.name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off),c.name];
    for(const p of e){ parts.push(p); cdLen+=p.length; }
  }
  parts.push(new Uint8Array([80,75,5,6]),u16(0),u16(0),u16(central.length),u16(central.length),u32(cdLen),u32(cdStart),u16(0));
  const blob=new Blob(parts,{type:"application/zip"});
  const nameZ=`totonoi-photos-${today()}.zip`;
  const file=new File([blob],nameZ,{type:"application/zip"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:"ととのい帳 写真バックアップ"}); bkphInfo(); notify(`写真${central.length}枚を書き出しました。`); return; }
    catch(e){ if(e&&e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nameZ;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  notify(`写真${central.length}枚を書き出しました。`);
}
async function bkPhotosImport(f){
  try{
    const buf=new Uint8Array(await f.arrayBuffer());
    const dv=new DataView(buf.buffer);
    let eocd=-1;
    for(let i=buf.length-22;i>=0&&i>buf.length-70000;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
    if(eocd<0) throw 0;
    const count=dv.getUint16(eocd+10,true), cdOff=dv.getUint32(eocd+16,true);
    const dec=new TextDecoder(); let p=cdOff, n=0;
    for(let i=0;i<count;i++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true),
            nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true),
            lho=dv.getUint32(p+42,true);
      const name=dec.decode(buf.subarray(p+46,p+46+nlen));
      p+=46+nlen+elen+clen;
      if(method!==0||!name.endsWith(".jpg")) continue;
      const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
      const start=lho+30+lnlen+lelen;
      const vid=name.slice(0,-4);
      await photoPut(vid,new Blob([buf.subarray(start,start+csize)],{type:"image/jpeg"}));
      const v=state.visits.find(x=>x.id===vid); if(v) v.ph=1;
      n++;
    }
    save(); renderAll(); bkphInfo();
    notify(n?`写真${n}枚を読み込みました。`:"読み込める写真がありませんでした。");
  }catch(e){ notify("ZIPの読み込みに失敗しました。","err"); }
}
async function bkphInfo(){
  const el=document.getElementById("bkphinfo"); if(!el) return;
  const keys=await photoKeys();
  el.textContent=`写真：${keys.length}枚（端末内IndexedDB）。データJSONには含まれないため、写真は別途ZIPで保全してください。`;
}
document.getElementById("bkPhExport").addEventListener("click",bkPhotosExport);
document.getElementById("bkPhImport").addEventListener("click",()=>document.getElementById("bkPhFile").click());
document.getElementById("bkPhFile").addEventListener("change",e=>{ if(e.target.files[0]) bkPhotosImport(e.target.files[0]); e.target.value=""; });

/* ---------- タブ・全体描画 ---------- */
let curTab="book";
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{
  curTab=b.dataset.v;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  ["book","find","shelf","log"].forEach(v=>document.getElementById("pane-"+v).classList.toggle("on",v===curTab));
  document.getElementById("ctabar").style.display=(curTab==="book"||curTab==="find")?"flex":"none";
  /* タブを開いた瞬間に必ずそのタブを描き直す（別タブで押印→棚のカウントが古いまま、のバグ修正） */
  if(curTab==="find"){ mapInit=true; renderFind(); renderMap(); }
  if(curTab==="shelf") renderShelf();
}));
function renderAll(){
  renderBook();
  if(curTab==="find"||mapInit){ renderFind(); renderMap(); }
  if(curTab==="shelf") renderShelf();
  renderLog();
}
const radEl=document.getElementById("radius");
radEl.value=state.radius;
const radLabel=()=>document.getElementById("radlabel").textContent=`GPS判定半径 — ${state.radius}m`;
radLabel();
radEl.addEventListener("input",()=>{ state.radius=+radEl.value; radLabel(); save(); });
document.getElementById("edition").textContent=EDITION;
document.getElementById("verNote").textContent=
  `ととのい帳 v${APP_VERSION}（アルファ版）／ 収録${FACILITIES.length}湯（全国470枠＋東海TOP30、${EDITION}・カタログ第${DATA.catalog}版・サウナイキタイ）。記録はこの端末に保存されます。バックアップはこまめに。写真・栞（ごほうび）は正式版で対応予定。`;
migrateObs();  /* 旧形式の観測温度（alpha.17〜19）を部屋紐付きログへ。冪等 */
renderBook(); renderFind(); renderChips(); renderShelf(); renderLog(); bkInfo(); bkphInfo();
setTimeout(checkShiori,900);
/* 自動保全（外部依存禁止の枠内でできる最大）：persist要求＋起動時の未保全検知 */
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
(function(){
  const unsaved=Math.max(0,state.visits.length-(state.bk?state.bk.visits:0));
  const days=state.bk?Math.floor((Date.now()-Date.parse(state.bk.at))/86400000):null;
  if(unsaved>=5) setTimeout(()=>notify(`未保全の記録が${unsaved}件あります。記録タブからバックアップの書き出しを。`),1200);
  else if(days!=null&&days>=30&&unsaved>0) setTimeout(()=>notify(`最後の書き出しから${days}日たちました。記録タブからバックアップを。`),1200);
})();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v="+APP_VERSION).catch(()=>{});
</script>
