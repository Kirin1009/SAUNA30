<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEF6E6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>サ道場</title>
<style>
  :root{
    --bg:#FEF6E6; --panel:#FFFFF8; --text:#4A3B2E; --mid:#6E5D4B; --muted:#A08C72;
    --line:#E8DCC3; --line2:#D9CBA8; --stamp:#D9483B; --gold:#C7973F; --indigo:#4A5E8B;
    --hot:#C75B47; --cold:#5E88A0; --cream:#FEF6E6; --ok:#6F9A63;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    font-size:15px;line-height:1.6;padding-bottom:60px}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px}
  header{padding:calc(24px + env(safe-area-inset-top)) 0 14px;border-bottom:2px dashed var(--line2)}
  .hrow{display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:19px;font-weight:800;letter-spacing:.3em;margin:0}
  .edition{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--muted);letter-spacing:.1em}
  .sub{margin:8px 0 0;font-size:12px;color:var(--mid);line-height:1.7}
  .actions{display:flex;gap:10px;margin-top:16px;align-items:center}
  button{font-family:inherit;cursor:pointer}
  .btn{font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line2);
    background:var(--panel);color:var(--text)}
  .btn.primary{background:var(--stamp);color:var(--cream);border-color:var(--stamp);box-shadow:0 2px 0 rgba(74,59,46,.15)}
  .btn:disabled{opacity:.4}
  .total{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
  .notice{margin-top:13px;padding:11px 13px;border:1.5px solid var(--line);border-left:3px solid var(--ok);
    background:var(--panel);font-size:12.5px;line-height:1.7;color:var(--mid);border-radius:10px}
  .notice.err{border-left-color:var(--stamp)}
  .qcard{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-top:12px;color:var(--text);box-shadow:0 1px 0 rgba(74,59,46,.05)}
  .qcard.done{border-color:var(--gold);background:#FFFDF6}
  .qhead{display:flex;align-items:center;gap:11px}
  .qseal{width:40px;height:40px;border-radius:50%;border:2px solid var(--indigo);color:var(--indigo);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif;transform:rotate(-6deg)}
  .qcard.done .qseal{border-color:var(--gold);color:var(--gold);background:rgba(199,151,63,.08)}
  .qbody{flex:1;min-width:0}
  .qname{font-size:14.5px;font-weight:700}
  .qdesc{font-size:11px;color:var(--muted);margin-top:1px}
  .qnum{font-family:ui-monospace,monospace;font-size:13px;color:var(--mid);flex-shrink:0;text-align:right}
  .qnum small{font-size:10px;color:var(--muted)}
  .qrank{font-size:10px;color:var(--gold);font-weight:700}
  .bar{height:5px;background:#F2E6CC;margin-top:10px;border-radius:3px;overflow:hidden}
  .bar>div{height:100%;border-radius:3px;background:var(--indigo);transition:width .3s}
  .qcard.done .bar>div{background:var(--gold)}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
  .settext{font-size:12px;color:var(--mid);line-height:1.85;margin:8px 0 0}
  .sect{border-top:1.5px dashed var(--line2);margin-top:26px;padding-top:18px}
  input[type=range]{width:100%;accent-color:var(--hot)}
  .overlay{position:fixed;inset:0;background:rgba(74,59,46,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.on{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
    padding:20px 18px calc(28px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;
    box-shadow:0 -6px 24px rgba(74,59,46,.18)}
  .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .xbtn{background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
  .frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;
    border-bottom:1.5px dashed var(--line);padding:10px 2px;color:var(--text)}
  .frow .dot{width:11px;height:11px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0}
  .frow .hanko{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--stamp);color:var(--stamp);
    background:rgba(217,72,59,.08);display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;flex-shrink:0;transform:rotate(-8deg);font-family:'Hiragino Mincho ProN','Yu Mincho',serif}
  .frow .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .ct{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);flex-shrink:0}
  .choosebtn{display:flex;justify-content:space-between;width:100%;background:var(--panel);border:1.5px solid var(--line2);
    border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:14px;color:var(--text)}
  .choosebtn .d{color:var(--muted);font-family:ui-monospace,monospace;font-size:11px}
  .mono{font-family:ui-monospace,monospace}
  #stampfx{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;z-index:99}
  #stampfx.on{display:flex}
  #stampfx .seal{animation:pon .55s cubic-bezier(.2,2.2,.4,1) both}
  #stampfx.bye{opacity:0;transition:opacity .45s}
  @keyframes pon{0%{transform:scale(2.4);opacity:0}55%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
  .fxname{margin-top:10px;background:var(--panel);border:1.5px solid var(--line2);border-radius:999px;
    padding:6px 16px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(74,59,46,.15)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><h1>サ道場<span style="font-size:12px;letter-spacing:.2em;color:var(--indigo);margin-left:10px">東海</span></h1><span class="edition" id="edition"></span></div>
    <p class="sub"><b>東海地方のサウナを極める</b>修行帳。東海5県（岐阜・愛知・三重・静岡・滋賀）のTOP30、全149湯から出題。<br>全国のライフタイムチャレンジは姉妹帳 <a href="../" style="color:var(--indigo)">Sauna470s</a> で。</p>
  </header>

  <div class="actions">
    <button class="btn primary" id="stampBtn" style="flex:1">現在地で押印</button>
    <span class="total" id="total"></span>
  </div>
  <div id="notice" style="display:none"></div>

  <div id="quests"></div>

  <div class="sect">
    <div class="eyebrow">記録の取り込み</div>
    <p class="settext">Sauna470sの設定タブで書き出したバックアップJSONを読み込むと、行った施設がすべてのお題に反映されます（こちらからの逆流はありません）。</p>
    <button class="btn" id="importBtn" style="width:100%;margin-top:10px">Sauna470sのバックアップを読み込む</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div class="sect">
    <div class="eyebrow" id="radlabel"></div>
    <input type="range" min="100" max="1000" step="50" id="radius">
  </div>

  <div class="sect">
    <div class="eyebrow">この帳について</div>
    <p class="settext" id="verNote"></p>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="stampfx"></div>

  {id:"kiwame", seal:"道", name:"東海のサウナを極める", desc:"東海5県TOP30・全湯踏破",
   test:f=>true, goal:"all"},
];


QUESTS.forEach(q=>q.targets=FAC.filter(q.test).map(f=>f.id));

/* ---------- 状態 ---------- */
const KEY="sadojo:v1";
let state={stamps:{}, radius:300};
try{ const raw=localStorage.getItem(KEY); if(raw) state=Object.assign(state,JSON.parse(raw)); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){ notify("保存に失敗しました。","err"); } };
const stamped=id=>!!state.stamps[id];

/* ---------- 進捗 ---------- */
function progress(q){
  const done=q.targets.filter(stamped);
  if(q.goal==="groups"){
    const got=q.groups.filter(g=>done.some(id=>byId[id].pref===g));
    return {n:got.length, t:q.groups.length, full:got.length===q.groups.length, label:null, doneIds:done};
  }
  if(q.goal==="count") return {n:done.length, t:q.need, full:done.length>=q.need, label:null, doneIds:done, pool:q.targets.length};
  if(q.goal==="tiers"){
    let label="序ノ口";
    for(const [th,nm] of q.tiers){ if(done.length>=th) label=nm; }
    const full=done.length>=q.targets.length;
    return {n:done.length, t:q.targets.length, full, label:done.length>0?label:null, doneIds:done};
  }
  return {n:done.length, t:q.targets.length, full:done.length===q.targets.length, label:null, doneIds:done};
}

/* ---------- 描画 ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  document.getElementById("edition").textContent=EDITION;
  document.getElementById("verNote").textContent=
    `サ道場 東海 v${APP_VERSION} ／ 出題は東海5県TOP30（${EDITION}・サウナイキタイ）。水温・サウナ温度・料金・予約情報は版の時点のものです。記録はこの端末に保存されます。`;
  const totalStamped=Object.keys(state.stamps).filter(id=>byId[id]).length;
  document.getElementById("total").innerHTML=`押印 ${totalStamped}<span style="font-size:10px">湯</span>`;
  document.getElementById("quests").innerHTML=QUESTS.map(q=>{
    const head=q.sec?`<div class="eyebrow" style="margin:22px 2px 0">${esc(q.sec)}</div>`:"";
    const p=progress(q);
    const pct=p.t?Math.min(100,p.n/p.t*100):0;
    return head+`<button class="qcard${p.full?" done":""}" data-q="${q.id}">
      <div class="qhead">
        <span class="qseal">${q.seal}</span>
        <span class="qbody">
          <div class="qname">${esc(q.name)}${p.full?' <span class="qrank">満願</span>':p.label?` <span class="qrank">${esc(p.label)}</span>`:""}</div>
          <div class="qdesc">${esc(q.desc)}${q.goal==="count"?`（対象${q.targets.length}湯から${q.need}）`:""}</div>
        </span>
        <span class="qnum">${p.n}<small>/${p.t}</small></span>
      </div>
      <div class="bar"><div style="width:${pct.toFixed(1)}%"></div></div>
    </button>`;
  }).join("");
  document.querySelectorAll(".qcard").forEach(b=>b.addEventListener("click",()=>openQuest(b.dataset.q)));
}

/* ---------- シート ---------- */
const overlay=document.getElementById("overlay"), sheetEl=document.getElementById("sheet");
const openSheet=h=>{ sheetEl.innerHTML=h; overlay.classList.add("on"); sheetEl.scrollTop=0; document.body.style.overflow="hidden"; };
const closeSheet=()=>{ overlay.classList.remove("on"); document.body.style.overflow=""; };
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeSheet(); });
window.__close=closeSheet;
const sheetHead=t=>`<div class="shead"><span class="eyebrow">${esc(t)}</span><button class="xbtn" onclick="window.__close()">×</button></div>`;

function openQuest(qid){
  const q=QUESTS.find(x=>x.id===qid), p=progress(q);
  const rows=q.targets
    .map(id=>byId[id])
    .sort((a,b)=>(stamped(b.id)?1:0)-(stamped(a.id)?1:0))
    .map(f=>`<div class="frow">
      ${stamped(f.id)?`<span class="hanko">${q.seal}</span>`:`<span class="dot"></span>`}
      <span class="nm">${esc(f.name)}</span>
      <span class="ct">${esc(PREF_LABEL[f.pref]||"")}${esc(f.city?"・"+f.city:"")}</span>
      <button class="btn" style="padding:4px 10px;font-size:11px" onclick="window.__maps(${f.lat},${f.lng})">地図</button>
    </div>`).join("");
  openSheet(sheetHead(q.name)+`
    <p style="font-size:12.5px;color:var(--mid);line-height:1.8;margin:0 0 6px">${esc(q.desc)}。
      進捗 <b class="mono">${p.n}/${p.t}</b>${p.label?`・現在の番付 <b style="color:var(--gold)">${esc(p.label)}</b>`:""}${p.full?'・<b style="color:var(--gold)">満願</b>':""}</p>
    ${p.full?`<button class="btn" style="width:100%;margin:8px 0" onclick="window.__cert('${q.id}')">満願之証を保存</button>`:""}
    <p style="font-size:10.5px;color:var(--muted);margin:4px 0 8px">押印は「現在地で押印」から。GPSが届かない場所では施設名を長押し（2秒）で手動押印できます。</p>
    <div>${rows}</div>`);
  /* 手動押印（長押し） */
  /* 長押し＝押印。スクロール(pointercancel)や指の移動では絶対に発火させない */
  let timer=null, sx=0, sy=0;
  const ordered=q.targets.map(id=>byId[id]).sort((a,b)=>(stamped(b.id)?1:0)-(stamped(a.id)?1:0));
  sheetEl.querySelectorAll(".frow").forEach((row,i)=>{
    const f=ordered[i];
    const stop=()=>{ clearTimeout(timer); timer=null; };
    row.addEventListener("pointerdown",e=>{
      sx=e.clientX; sy=e.clientY;
      timer=setTimeout(()=>{ timer=null; toggleStamp(f); openQuest(qid); },1600);
    });
    row.addEventListener("pointermove",e=>{
      if(timer && Math.hypot(e.clientX-sx,e.clientY-sy)>12) stop();   // スクロールの初動で解除
    });
    row.addEventListener("pointerup",stop);
    row.addEventListener("pointercancel",stop);                      // ブラウザがスクロールを取った時
    row.addEventListener("pointerleave",stop);
  });
}
window.__maps=(lat,lng)=>window.open(`https://www.google.com/maps?q=${lat},${lng}`,"_blank");

function toggleStamp(f){
  if(stamped(f.id)){
    if(!confirm(`${f.name} の押印を取り消しますか？`)) return;
    delete state.stamps[f.id]; save(); render(); notify("押印を取り消しました");
  }else{
    state.stamps[f.id]=today(); save(); render(); stampFx(f);
  }
}

/* ---------- 押印演出 ---------- */
let fxT1,fxT2;
function stampFx(f){
  const el=document.getElementById("stampfx");
  const full=QUESTS.filter(q=>q.targets.includes(f.id)).map(q=>progress(q)).some(p=>p.full);
  const ink=full?"#C7973F":"#D9483B";
  el.innerHTML=`<div class="seal"><svg width="140" height="140" viewBox="0 0 140 140">
    <defs><filter id="fxr" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/></filter></defs>
    <g filter="url(#fxr)" opacity="0.9">
      <circle cx="70" cy="70" r="62" fill="none" stroke="${ink}" stroke-width="5.5"/>
      <circle cx="70" cy="70" r="53" fill="none" stroke="${ink}" stroke-width="1.5"/>
      <text x="70" y="41" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="${ink}">サ道場 東海</text>
      <text x="70" y="88" text-anchor="middle" font-size="46" font-weight="800" fill="${ink}" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">修</text>
      <text x="70" y="113" text-anchor="middle" font-size="10.5" letter-spacing="1" fill="${ink}" font-family="ui-monospace,monospace">${esc(today())}</text>
    </g></svg></div>
    <div class="fxname">${esc(f.name)}</div>`;
  el.classList.remove("bye"); el.classList.add("on");
  clearTimeout(fxT1); clearTimeout(fxT2);
  fxT1=setTimeout(()=>el.classList.add("bye"),1400);
  fxT2=setTimeout(()=>el.classList.remove("on","bye"),1900);
}

/* ---------- 満願之証 ---------- */
window.__cert=qid=>{
  const q=QUESTS.find(x=>x.id===qid), p=progress(q);
  const seals=q.targets.filter(stamped);
  const cols=seals.length>20?8:5, cell=(560-100)/cols, rows=Math.ceil(seals.length/cols);
  const H=250+rows*cell+150;
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 ${H}" width="560" height="${H}"><rect width="560" height="${H}" fill="#FEF6E6"/>
    <rect x="14" y="14" width="532" height="${H-28}" fill="none" stroke="#C7973F" stroke-width="3"/>
    <rect x="22" y="22" width="516" height="${H-44}" fill="none" stroke="#C7973F" stroke-width="1"/>
    <text x="280" y="86" text-anchor="middle" font-size="30" font-weight="800" fill="#4A3B2E" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" letter-spacing="10">満願之証</text>
    <text x="280" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#C75B47" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" letter-spacing="3">${esc(q.name)}</text>
    <text x="280" y="178" text-anchor="middle" font-size="13" fill="#8A7358">${seals.length}湯 満了</text>
    <text x="280" y="204" text-anchor="middle" font-size="13" fill="#8A7358" font-family="ui-monospace,monospace">${esc(today())}</text>`;
  seals.forEach((id,i)=>{
    const x=50+(i%cols)*cell+cell/2, y=250+Math.floor(i/cols)*cell+cell/2, r=cell*0.36;
    svg+=`<g transform="rotate(${(i%7-3)*3} ${x} ${y})"><circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="#D9483B" stroke-width="2"/>
      <text x="${x}" y="${y+r*0.4}" text-anchor="middle" font-size="${r}" font-weight="800" fill="#D9483B" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">${q.seal}</text></g>`;
  });
  svg+=`<g transform="rotate(-9 464 ${H-92})"><circle cx="464" cy="${H-92}" r="42" fill="none" stroke="#C7973F" stroke-width="5"/>
    <text x="464" y="${H-78}" text-anchor="middle" font-size="38" font-weight="800" fill="#C7973F" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">満</text></g>
    <text x="50" y="${H-64}" font-size="12" fill="#8A7358">サ道場 東海 — ${esc(EDITION)}</text></svg>`;
  const disp=svg.replace(/width="560" height="\d+"/,'style="width:100%;height:auto;display:block"');
  openSheet(sheetHead("満願之証")+`<div style="border:1.5px solid var(--line);border-radius:12px;overflow:hidden">${disp}</div>
    <button class="btn primary" style="width:100%;margin-top:14px" id="certSave">画像として保存</button>`);
  document.getElementById("certSave").addEventListener("click",()=>{
    const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
    const img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=img.width*2; c.height=img.height*2;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      const a=document.createElement("a"); a.href=c.toDataURL("image/png"); a.download=`sadojo-満願之証-${q.id}.png`; a.click();
      notify("保存しました"); };
    img.onerror=()=>{ URL.revokeObjectURL(url); notify("画像の生成に失敗しました。","err"); };
    img.src=url;
  });
};

/* ---------- GPS押印 ---------- */
const rad=d=>d*Math.PI/180;
function distance(a,b){
  const R=6371000, dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const today=()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const questTargets=new Set(QUESTS.flatMap(q=>q.targets));
document.getElementById("stampBtn").addEventListener("click",()=>{
  const btn=document.getElementById("stampBtn");
  btn.disabled=true; btn.textContent="測位中…";
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.disabled=false; btn.textContent="現在地で押印";
    const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
    const near=FAC.filter(f=>questTargets.has(f.id))
      .map(f=>({f,d:distance(p,f)})).filter(x=>x.d<=state.radius).sort((a,b)=>a.d-b.d);
    if(!near.length){
      const alls=FAC.map(f=>({f,d:distance(p,f)})).sort((a,b)=>a.d-b.d)[0];
      notify(`半径${state.radius}m以内にお題の施設なし。最寄りは ${alls.f.name}（約${Math.round(alls.d)}m）。お題対象外の施設はSauna470sで押してください。`,"err");
    }else if(near.length===1){ toggleStampByGps(near[0].f); }
    else openSheet(sheetHead("どの施設にいますか？")+near.map(x=>
      `<button class="choosebtn" onclick="window.__gps('${x.f.id}')"><span>${esc(x.f.name)}</span><span class="d">${Math.round(x.d)}m</span></button>`).join(""));
  },err=>{ btn.disabled=false; btn.textContent="現在地で押印"; notify("現在地を取得できませんでした。","err"); },
  {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
});
function toggleStampByGps(f){ if(stamped(f.id)){ notify(`${f.name} は押印済みです`); return; } state.stamps[f.id]=today(); save(); render(); stampFx(f); }
window.__gps=id=>{ closeSheet(); toggleStampByGps(byId[id]); };

/* ---------- Sauna470sバックアップ取り込み ---------- */
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.state||!Array.isArray(d.state.visits)) throw new Error();
      let added=0;
      for(const v of [...d.state.visits].reverse()){
        if(byId[v.facilityId] && !state.stamps[v.facilityId]){ state.stamps[v.facilityId]=v.date||today(); added++; }
      }
      save(); render();
      notify(added?`${added}湯ぶんの押印を取り込みました`:"新しく取り込める押印はありませんでした（既に反映済み）");
    }catch{ notify("読み込めませんでした。Sauna470sで書き出したファイルを選んでください。","err"); }
  };
  r.readAsText(file); e.target.value="";
});

/* ---------- 通知・設定 ---------- */
let ntfT;
function notify(msg,kind){
  const el=document.getElementById("notice");
  el.className="notice"+(kind==="err"?" err":""); el.textContent=msg; el.style.display="block";
  clearTimeout(ntfT); ntfT=setTimeout(()=>el.style.display="none",5000);
}
const radEl=document.getElementById("radius");
radEl.value=state.radius;
const radLabel=()=>document.getElementById("radlabel").textContent=`GPS判定半径 — ${state.radius}m`;
radLabel();
radEl.addEventListener("input",()=>{ state.radius=+radEl.value; radLabel(); save(); });

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v="+APP_VERSION).catch(()=>{});
</script>
</body>
</html>
