<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEF6E6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>サ道場</title>
<style>
  :root{
    --bg:#FEF6E6; --panel:#FFFFF8; --text:#4A3B2E; --mid:#6E5D4B; --muted:#A08C72;
    --line:#E8DCC3; --line2:#D9CBA8; --stamp:#D9483B; --gold:#C7973F; --indigo:#4A5E8B;
    --hot:#C75B47; --cold:#5E88A0; --cream:#FEF6E6; --ok:#6F9A63;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    font-size:15px;line-height:1.6;padding-bottom:60px}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px}
  header{padding:calc(24px + env(safe-area-inset-top)) 0 14px;border-bottom:2px dashed var(--line2)}
  .hrow{display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:19px;font-weight:800;letter-spacing:.3em;margin:0}
  .edition{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--muted);letter-spacing:.1em}
  .sub{margin:8px 0 0;font-size:12px;color:var(--mid);line-height:1.7}
  .actions{display:flex;gap:10px;margin-top:16px;align-items:center}
  button{font-family:inherit;cursor:pointer}
  .btn{font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line2);
    background:var(--panel);color:var(--text)}
  .btn.primary{background:var(--stamp);color:var(--cream);border-color:var(--stamp);box-shadow:0 2px 0 rgba(74,59,46,.15)}
  .btn:disabled{opacity:.4}
  .total{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
  .notice{margin-top:13px;padding:11px 13px;border:1.5px solid var(--line);border-left:3px solid var(--ok);
    background:var(--panel);font-size:12.5px;line-height:1.7;color:var(--mid);border-radius:10px}
  .notice.err{border-left-color:var(--stamp)}
  .qcard{display:block;width:100%;text-align:left;background:var(--panel);border:1.5px solid var(--line);
    border-radius:14px;padding:13px 14px;margin-top:12px;color:var(--text);box-shadow:0 1px 0 rgba(74,59,46,.05)}
  .qcard.done{border-color:var(--gold);background:#FFFDF6}
  .qhead{display:flex;align-items:center;gap:11px}
  .qseal{width:40px;height:40px;border-radius:50%;border:2px solid var(--indigo);color:var(--indigo);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;
    font-family:'Hiragino Mincho ProN','Yu Mincho',serif;transform:rotate(-6deg)}
  .qcard.done .qseal{border-color:var(--gold);color:var(--gold);background:rgba(199,151,63,.08)}
  .qbody{flex:1;min-width:0}
  .qname{font-size:14.5px;font-weight:700}
  .qdesc{font-size:11px;color:var(--muted);margin-top:1px}
  .qnum{font-family:ui-monospace,monospace;font-size:13px;color:var(--mid);flex-shrink:0;text-align:right}
  .qnum small{font-size:10px;color:var(--muted)}
  .qrank{font-size:10px;color:var(--gold);font-weight:700}
  .bar{height:5px;background:#F2E6CC;margin-top:10px;border-radius:3px;overflow:hidden}
  .bar>div{height:100%;border-radius:3px;background:var(--indigo);transition:width .3s}
  .qcard.done .bar>div{background:var(--gold)}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
  .settext{font-size:12px;color:var(--mid);line-height:1.85;margin:8px 0 0}
  .tabs{display:flex;gap:8px;margin-top:14px}
  .tab{flex:1;padding:9px;border-radius:999px;border:1.5px solid var(--line2);background:var(--panel);
    font-size:13px;font-weight:700;color:var(--mid);letter-spacing:.1em}
  .tab.on{background:var(--indigo);border-color:var(--indigo);color:#FEF6E6}
  #mapbox{border:1.5px solid var(--line2);border-radius:14px;overflow:hidden;background:#FBF1DC;margin-top:14px}
  #mapbox svg{width:100%;display:block;touch-action:none}
  .maplegend{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.9}
  .badge{display:inline-block;font-size:10px;font-weight:700;color:var(--mid);border:1px solid var(--line2);
    border-radius:6px;padding:1px 6px;margin-right:4px;vertical-align:1px}
  .wantstar{color:var(--gold);font-size:12px;margin-left:4px}
  .fbtnrow{display:flex;gap:8px;margin-top:12px}
  .fbtnrow .btn{flex:1;padding:11px 4px;font-size:12.5px}
  .backbtn{font-size:12px;color:var(--indigo);background:none;border:none;font-weight:700;padding:4px 0}
  .bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
  .bcell{background:none;border:none;padding:0;text-align:center;font-family:inherit;color:var(--text);min-width:0}
  .bcell svg{width:100%;height:auto;display:block}
  .bnm{display:block;font-size:8.5px;color:var(--mid);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnm.off{color:#C9B58F}
  /* 家紋スタンプ：黒/透過の印影画像をマスクにして currentColor で染める（紺→朱→金の切替が画像1枚で済む） */
  .kmz{display:block;width:100%;height:100%;background:currentColor;
    -webkit-mask:var(--km) center/contain no-repeat;mask:var(--km) center/contain no-repeat}
  .shihan{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;background:#FBF1DC}
  .chgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 6px;margin-top:12px}
  .chgrid figure{text-align:center;margin:0}
  .chgrid img{width:100%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line2);background:#FBF1DC;display:block}
  .chgrid figcaption{font-size:9px;color:var(--mid);margin-top:3px;white-space:nowrap}
  .sect{border-top:1.5px dashed var(--line2);margin-top:26px;padding-top:18px}
  input[type=range]{width:100%;accent-color:var(--hot)}
  .overlay{position:fixed;inset:0;background:rgba(74,59,46,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.on{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
    padding:20px 18px calc(28px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;
    box-shadow:0 -6px 24px rgba(74,59,46,.18)}
  .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .xbtn{background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
  .frow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;
    border-bottom:1.5px dashed var(--line);padding:10px 2px;color:var(--text)}
  .frow .dot{width:11px;height:11px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0}
  .frow .hanko{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--stamp);color:var(--stamp);
    background:rgba(217,72,59,.08);display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;flex-shrink:0;transform:rotate(-8deg);font-family:'Hiragino Mincho ProN','Yu Mincho',serif}
  .frow .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .ct{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted);flex-shrink:0}
  .choosebtn{display:flex;justify-content:space-between;width:100%;background:var(--panel);border:1.5px solid var(--line2);
    border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:14px;color:var(--text)}
  .choosebtn .d{color:var(--muted);font-family:ui-monospace,monospace;font-size:11px}
  .mono{font-family:ui-monospace,monospace}
  #stampfx{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;z-index:99}
  #stampfx.on{display:flex}
  #stampfx .seal{animation:pon .55s cubic-bezier(.2,2.2,.4,1) both}
  #stampfx.bye{opacity:0;transition:opacity .45s}
  @keyframes pon{0%{transform:scale(2.4);opacity:0}55%{transform:scale(.94);opacity:1}100%{transform:scale(1)}}
  .fxname{margin-top:10px;background:var(--panel);border:1.5px solid var(--line2);border-radius:999px;
    padding:6px 16px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(74,59,46,.15)}
</style>
</head>

<div class="wrap">
  <header>
    <div class="hrow"><h1>サ道場<span style="font-size:12px;letter-spacing:.2em;color:var(--indigo);margin-left:10px">東海</span></h1><span class="edition" id="edition"></span></div>
    <p class="sub"><b>東海地方のサウナを極める</b>修行帳。東海5県（岐阜・愛知・三重・静岡・滋賀）のTOP30、全149湯から出題。<br>全国のライフタイムチャレンジは姉妹帳 <a href="../" style="color:var(--indigo)">Sauna470s</a> で。</p>
  </header>

  <div class="actions">
    <button class="btn primary" id="stampBtn" style="flex:1">現在地で押印</button>
    <span class="total" id="total"></span>
  </div>
  <div id="notice" style="display:none"></div>

  <div class="tabs">
    <button class="tab on" data-v="dojo">道場</button>
    <button class="tab" data-v="book">判子帳</button>
    <button class="tab" data-v="map">地図</button>
  </div>

  <div id="bookView" style="display:none"></div>

  <div id="mapView" style="display:none">
    <div id="mapbox"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" id="mapReset" style="padding:7px 14px;font-size:12px">全体</button>
      <button class="btn" id="regBtn" style="flex:1;font-size:12px">現在地で施設を登録（枠外）</button>
    </div>
    <p class="maplegend">●赤=押印済み ○県色=未踏 ○金=行きたい ▢=自分で登録した施設。タップで施設カードが開きます。ピンチ・ホイールで拡大。</p>
  </div>

  <div id="dojoView">
  <div id="quests"></div>

  <div class="sect">
    <div class="eyebrow">記録の取り込み</div>
    <p class="settext">Sauna470sの設定タブで書き出したバックアップJSONを読み込むと、行った施設がすべてのお題に反映されます（こちらからの逆流はありません）。</p>
    <button class="btn" id="importBtn" style="width:100%;margin-top:10px">Sauna470sのバックアップを読み込む</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div class="sect">
    <div class="eyebrow" id="radlabel"></div>
    <input type="range" min="100" max="1000" step="50" id="radius">
  </div>

  <div class="sect">
    <div class="eyebrow">道場の面々</div>
    <div class="chgrid" id="chgrid"></div>
    <p class="settext" style="font-size:10.5px">東海ゆかりの武将たち。お題の師範と隠し絵に登場します。</p>
  </div>

  <div class="sect">
    <div class="eyebrow">この帳について</div>
    <p class="settext" id="verNote"></p>
  </div>
  </div><!-- /dojoView -->
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="stampfx"></div>

function distance(a,b){
  const R=6371000, dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

/* ---------- 進捗 ---------- */
function progress(q){
  const done=q.targets.filter(stamped);
  if(q.goal==="groups"){
    const got=q.groups.filter(g=>done.some(id=>byId[id].pref===g));
    return {n:got.length, t:q.groups.length, full:got.length===q.groups.length, label:null, doneIds:done};
  }
  if(q.goal==="count") return {n:done.length, t:q.need, full:done.length>=q.need, label:null, doneIds:done, pool:q.targets.length};
  if(q.goal==="tiers"){
    let label="序ノ口";
    for(const [th,nm] of q.tiers){ if(done.length>=th) label=nm; }
    const full=done.length>=q.targets.length;
    return {n:done.length, t:q.targets.length, full, label:done.length>0?label:null, doneIds:done};
  }
  return {n:done.length, t:q.targets.length, full:done.length===q.targets.length, label:null, doneIds:done};
}

/* お題の隠し絵：10ピースのパズル。押印の進み具合でめくれ、満願で完成 */
function tileArt(q,p){
  const open=p.full?10:Math.min(9,Math.floor(p.n/p.t*10));
  let s=`<svg viewBox="0 0 280 160" style="width:100%;display:block;border-radius:9px;background:#FBF1DC">
    <image href="art/st-${q.id}.webp" x="0" y="0" width="280" height="160" preserveAspectRatio="xMidYMid slice"/>`;
  for(let i=open;i<10;i++){
    const x=(i%5)*56, y=Math.floor(i/5)*80;
    s+=`<g><rect x="${x}" y="${y}" width="56" height="80" fill="#F2E6CC"/>
      <rect x="${x+1}" y="${y+1}" width="54" height="78" fill="none" stroke="#E0CFA8" stroke-width="1.2" stroke-dasharray="3 3"/>`;
    if(i===open){
      const need=Math.ceil((i+1)*p.t/10)-p.n;
      s+=`<text x="${x+28}" y="${y+42}" text-anchor="middle" font-size="9.5" fill="#C9B58F" font-weight="700">あと${need}湯</text>
          <text x="${x+28}" y="${y+56}" text-anchor="middle" font-size="9" fill="#C9B58F">でひらく</text>`;
    }else{
      s+=`<text x="${x+28}" y="${y+46}" text-anchor="middle" font-size="13" fill="#E0CFA8" font-weight="700" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">${q.seal}</text>`;
    }
    s+=`</g>`;
  }
  s+=`<g stroke="#4A3B2E" stroke-width="0.5" opacity="0.18">`;
  for(let i=1;i<5;i++) s+=`<line x1="${i*56}" y1="0" x2="${i*56}" y2="160"/>`;
  s+=`<line x1="0" y1="80" x2="280" y2="80"/></g></svg>`;
  return s;
}

/* ---------- 採点 ----------
   v2.8〜：5軸（サウナ室/水風呂/外気浴・休憩/清潔・雰囲気/導線）×5点満点・0.1刻み＋特別加減点±2.5・理由必須。
   旧形式（4軸×25点＋±10、vなし）は読み込み時に換算して v:2 を付ける。導線だけは旧データに無いので既定値2.5で埋まる */
const AXES=["サウナ室","水風呂","外気浴・休憩","清潔・雰囲気","導線"];
const r1=v=>Math.round(v*10)/10;
for(const fid in state.scores){
  const sc=state.scores[fid];
  if(!sc.v){ sc.s=sc.s.map(v=>r1(v/5)); sc.s.push(2.5); sc.x=r1((sc.x||0)/4); sc.v=2; }
}
save();
const scoreTotal=sc=>r1(sc.s.reduce((a,b)=>a+b,0)+(sc.x||0));
const fmt1=v=>(Math.round(v*10)/10).toFixed(1);
window.__scoreOpen=(fid,backQid)=>{
  const f=byId[fid]; if(!f) return;
  const on=stamped(fid);
  const sc=state.scores[fid]||{s:[2.5,2.5,2.5,2.5,2.5],x:0,why:"",v:2};
  const AX=AXES;
  openSheet(sheetHead(on?"採点":"押印と採点")+`
    <p style="font-size:14px;font-weight:800;margin:0 0 2px">${esc(f.name)}</p>
    <p style="font-size:10.5px;color:var(--muted);margin:0 0 6px">5軸×5点（0.1刻み）＋特別加減点±2.5。基準線：竜泉寺の湯 ≒ 20.5点</p>
    ${AX.map((a,i)=>`<div style="margin-top:9px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${a}</span><b class="mono" id="sv${i}">${fmt1(sc.s[i])}</b></div>
      <input type="range" min="0" max="5" step="0.1" value="${sc.s[i]}" id="sx${i}"></div>`).join("")}
    <div style="margin-top:12px;border-top:1.5px dashed var(--line2);padding-top:10px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>特別加減点</span><b class="mono" id="svx">${sc.x>0?"+":""}${fmt1(sc.x)}</b></div>
      <input type="range" min="-2.5" max="2.5" step="0.1" value="${sc.x}" id="sxx">
      <input id="swhy" placeholder="特別加減点の理由（±をつけたら必須）" maxlength="60" value="${esc(sc.why||"")}"
        style="width:100%;font-family:inherit;font-size:13px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--text);margin-top:6px">
    </div>
    <p style="text-align:center;margin:12px 0 4px;font-size:12px;color:var(--mid)">合計 <b class="mono" id="stot" style="font-size:24px;color:var(--stamp)">${fmt1(scoreTotal(sc))}</b> 点</p>
    <div class="fbtnrow">
      <button class="btn primary" id="scSave">${on?"採点を保存":"押印して保存"}</button>
      ${on?"":`<button class="btn" id="scSkip">採点せず押印</button>`}
    </div>`);
  const cur=()=>({ s:AX.map((_,i)=>r1(+document.getElementById("sx"+i).value)), x:r1(+document.getElementById("sxx").value), why:document.getElementById("swhy").value.trim(), v:2 });
  const upd=()=>{ const c=cur();
    AX.forEach((_,i)=>document.getElementById("sv"+i).textContent=fmt1(c.s[i]));
    document.getElementById("svx").textContent=(c.x>0?"+":"")+fmt1(c.x);
    document.getElementById("stot").textContent=fmt1(scoreTotal(c)); };
  AX.forEach((_,i)=>document.getElementById("sx"+i).addEventListener("input",upd));
  document.getElementById("sxx").addEventListener("input",upd);
  document.getElementById("scSave").addEventListener("click",()=>{
    const c=cur();
    if(c.x!==0&&!c.why){ notify("特別加減点の理由を書いてください。","err"); return; }
    state.scores[fid]=c;
    const first=!stamped(fid);
    if(first) state.stamps[fid]=today();
    save(); render(); openFac(fid,backQid||undefined);
    if(first) stampFx(f);
  });
  const skip=document.getElementById("scSkip");
  if(skip) skip.addEventListener("click",()=>{
    state.stamps[fid]=today();
    save(); render(); openFac(fid,backQid||undefined); stampFx(f);
  });
};
/* ---------- 施設判子（自動生成） ----------
   形=施設タイプ（丸=温浴・銭湯 / 角=貸切・カプセル / 六角=宿 / 五角=アウトドア）、
   中央=施設名の頭文字、肩=市町村、下のモチーフ=実データの武勇伝
   （炎=サ室100°C・双炎=110°C / 雪=シングル / 月=深夜 / 鍵=予約制 / 小判=3,000円以上）。
   モチーフ3個以上は下弧に扇状に並べる（勲章式。数が増えるほど豪華になり破綻しない） */
const sealHash=s=>{ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h; };
function sealBadges(f){
  const b=[];
  if(f.smax!=null&&f.smax>=110) b.push("flame2"); else if(f.smax!=null&&f.smax>=100) b.push("flame");
  if(f.wmin!=null&&f.wmin<10) b.push("snow");
  if((f.tag||"").includes("n")) b.push("moon");
  if((f.tag||"").includes("y")) b.push("key");
  if(f.fee!=null&&f.fee>=3000) b.push("koban");
  return b;
}
function facSeal(f,o={}){
  const ink=o.ink||"#D9483B";
  const h=sealHash(f.id), rot=(h%9)-4;
  const attr=o.size?`width="${o.size}" height="${o.size}"`:"";
  let frame;
  if(f.k==="private"||f.k==="capsule")
    frame=`<rect x="-34" y="-34" width="68" height="68" rx="6" fill="none" stroke="${ink}" stroke-width="4.5"/><rect x="-28" y="-28" width="56" height="56" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  else if(f.k==="hotel")
    frame=`<polygon points="0,-37 32,-18.5 32,18.5 0,37 -32,18.5 -32,-18.5" fill="none" stroke="${ink}" stroke-width="4.5"/><polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  else if(f.k==="camp")
    frame=`<polygon points="0,-38 36,-10 23,36 -23,36 -36,-10" fill="none" stroke="${ink}" stroke-width="4.5"/><polygon points="0,-31 29,-8 18.5,29 -18.5,29 -29,-8" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  else
    frame=`<circle r="36" fill="none" stroke="${ink}" stroke-width="4.5"/><circle r="30" fill="none" stroke="${ink}" stroke-width="1.3"/>`;
  if(o.hidden)
    return `<svg viewBox="-45 -45 90 90" ${attr}><g opacity="0.4">${frame.replaceAll(ink,"#C9B58F")}<text y="10" text-anchor="middle" font-size="26" fill="#C9B58F" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">？</text></g></svg>`;
  const ch=(f.name||"").replace(/[ 　]/g,"")[0]||"湯";
  const badge=(t,x,y,s)=>{
    const g=v=>`<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s})">${v}</g>`;
    if(t==="flame") return g(`<path d="M0,-7 C3,-3 5,-1 5,2 C5,5.5 2.8,8 0,8 C-2.8,8 -5,5.5 -5,2 C-5,0 -4,-2 -2.5,-3.5 C-2.5,-1.5 -1,-0.5 0,-1 C-1,-3.5 -0.5,-5 0,-7Z" fill="${ink}"/>`);
    if(t==="flame2") return g(`<path transform="translate(-3.2,1) scale(0.72)" d="M0,-7 C3,-3 5,-1 5,2 C5,5.5 2.8,8 0,8 C-2.8,8 -5,5.5 -5,2 C-5,0 -4,-2 -2.5,-3.5 C-2.5,-1.5 -1,-0.5 0,-1 C-1,-3.5 -0.5,-5 0,-7Z" fill="${ink}"/><path transform="translate(2.6,0)" d="M0,-7 C3,-3 5,-1 5,2 C5,5.5 2.8,8 0,8 C-2.8,8 -5,5.5 -5,2 C-5,0 -4,-2 -2.5,-3.5 C-2.5,-1.5 -1,-0.5 0,-1 C-1,-3.5 -0.5,-5 0,-7Z" fill="${ink}"/>`);
    if(t==="snow") return g(`<g stroke="${ink}" stroke-width="1.7" stroke-linecap="round"><line y1="-6.5" y2="6.5"/><line x1="-5.6" y1="-3.2" x2="5.6" y2="3.2"/><line x1="-5.6" y1="3.2" x2="5.6" y2="-3.2"/></g>`);
    if(t==="moon") return g(`<path d="M2,-7 A7,7 0 1,0 2,7 A5.5,5.5 0 1,1 2,-7Z" fill="${ink}"/>`);
    if(t==="key") return g(`<circle r="3.2" cy="-2.5" fill="none" stroke="${ink}" stroke-width="1.7"/><rect x="-1" y="0.2" width="2" height="6.6" fill="${ink}"/><rect x="0.8" y="4" width="2.4" height="1.6" fill="${ink}"/>`);
    if(t==="koban") return g(`<ellipse rx="4.6" ry="6.4" fill="none" stroke="${ink}" stroke-width="1.8"/><line x1="-2" x2="2" stroke="${ink}" stroke-width="1.6"/>`);
    return "";
  };
  const bad=sealBadges(f);
  let bx="", chY=12, chFs=34;
  if(bad.length){
    chY=6; chFs=bad.length>=3?27:30;
    if(bad.length<=2) bx=bad.map((t,i)=>badge(t,(i-(bad.length-1)/2)*13,20,1)).join("");
    else bx=bad.map((t,i)=>{
      const a=(90+(i-(bad.length-1)/2)*24)*Math.PI/180;
      return badge(t,23.5*Math.cos(a),23.5*Math.sin(a)+0.5,0.8);
    }).join("");
  }
  const city=f.city?`<text y="-16" text-anchor="middle" font-size="${f.city.length>5?5.4:6.8}" letter-spacing="0.8" fill="${ink}">${esc(f.city)}</text>`:"";
  /* body＝<svg>とかすれフィルタ抜きの中身。満願之証が独立SVGとして再利用する */
  const body=`<g transform="rotate(${rot})">
    ${frame}${city}
    <text y="${chY}" text-anchor="middle" font-size="${chFs}" font-weight="800" fill="${ink}" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">${esc(ch)}</text>
    ${bx}
  </g>`;
  if(o.bodyOnly) return body;
  return `<svg viewBox="-45 -45 90 90" ${attr}><g filter="url(#sealtex)" opacity="0.9">${body}</g></svg>`;
}

function toggleStamp(f){
  if(stamped(f.id)){
    if(!confirm(`${f.name} の押印を取り消しますか？${state.scores[f.id]?"（採点も消えます）":""}`)) return;
    delete state.stamps[f.id]; delete state.scores[f.id]; save(); render(); notify("押印を取り消しました");
  }else{
    state.stamps[f.id]=today(); save(); render(); stampFx(f);
  }
}

/* ---------- 押印演出 ---------- */
let fxT1,fxT2;
function stampFx(f){
  const el=document.getElementById("stampfx");
  const full=QUESTS.filter(q=>q.targets.includes(f.id)).map(q=>progress(q)).some(p=>p.full);
  const ink=full?"#C7973F":"#D9483B";
  /* その施設だけの判子がここで初めて現れる（開封の瞬間） */
  el.innerHTML=`<div class="seal">${facSeal(f,{ink,size:150})}</div>
    <div class="fxname">${esc(f.name)}　${esc(today())}</div>`;
  el.classList.remove("bye"); el.classList.add("on");
  clearTimeout(fxT1); clearTimeout(fxT2);
  fxT1=setTimeout(()=>el.classList.add("bye"),1400);
  fxT2=setTimeout(()=>el.classList.remove("on","bye"),1900);
}

/* ---------- 満願之証 ---------- */
/* 下絵＝そのお題の武将タイル画。独立SVGとして保存するので data URI で埋め込む（SWキャッシュ済みなので圏外でも取れる） */
const ART_CACHE={};
async function artDataURL(qid){
  if(ART_CACHE[qid]!==undefined) return ART_CACHE[qid];
  try{
    const r=await fetch(`art/st-${qid}.webp`); if(!r.ok) throw 0;
    const bl=await r.blob();
    const durl=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(bl); });
    return ART_CACHE[qid]=durl;
  }catch(e){ return ART_CACHE[qid]=null; }
}
window.__cert=async qid=>{
  const q=QUESTS.find(x=>x.id===qid), p=progress(q);
  /* 判子は押した順（同日の中は出題順） */
  const seals=q.targets.filter(stamped)
    .sort((a,b)=>(state.stamps[a]||"").localeCompare(state.stamps[b]||"")||q.targets.indexOf(a)-q.targets.indexOf(b));
  const art=await artDataURL(qid);
  const cols=seals.length>60?10:seals.length>20?8:5, cell=(560-100)/cols, rows=Math.ceil(seals.length/cols);
  const gridY=250, gridH=rows*cell;
  const H=gridY+gridH+150;
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 ${H}" width="560" height="${H}">
    <defs><filter id="ctex" x="0" y="0" width="560" height="${H}" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.2"/>
    </filter></defs>
    <rect width="560" height="${H}" fill="#FEF6E6"/>
    <rect x="14" y="14" width="532" height="${H-28}" fill="none" stroke="#C7973F" stroke-width="3"/>
    <rect x="22" y="22" width="516" height="${H-44}" fill="none" stroke="#C7973F" stroke-width="1"/>
    <text x="280" y="86" text-anchor="middle" font-size="30" font-weight="800" fill="#4A3B2E" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" letter-spacing="10">満願之証</text>
    <text x="280" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#C75B47" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" letter-spacing="3">${esc(q.name)}</text>
    <text x="280" y="178" text-anchor="middle" font-size="13" fill="#8A7358">${seals.length}湯 満了</text>
    <text x="280" y="204" text-anchor="middle" font-size="13" fill="#8A7358" font-family="ui-monospace,monospace">${esc(today())}</text>`;
  /* 下絵：満願で完成した武将たちの絵を薄く敷く */
  if(art){
    svg+=`<image href="${art}" x="40" y="${gridY-12}" width="480" height="${gridH+24}" preserveAspectRatio="xMidYMid slice"/>
      <rect x="40" y="${gridY-12}" width="480" height="${gridH+24}" fill="#FEF6E6" opacity="0.38"/>
      <rect x="40" y="${gridY-12}" width="480" height="${gridH+24}" fill="none" stroke="#D9CBA8" stroke-width="1.2"/>`;
  }
  /* その上に、集めた施設の判子を押した順で敷き詰める（同じ判は2つとない） */
  svg+=`<g filter="url(#ctex)" opacity="0.92">`;
  seals.forEach((id,i)=>{
    const x=50+(i%cols)*cell+cell/2, y=gridY+Math.floor(i/cols)*cell+cell/2;
    svg+=`<g transform="translate(${x} ${y}) scale(${(cell*0.0104).toFixed(4)})">${facSeal(byId[id],{bodyOnly:1})}</g>`;
  });
  svg+=`</g>`;
  svg+=`<g transform="rotate(-9 464 ${H-92})"><circle cx="464" cy="${H-92}" r="42" fill="none" stroke="#C7973F" stroke-width="5"/>
    <text x="464" y="${H-78}" text-anchor="middle" font-size="38" font-weight="800" fill="#C7973F" font-family="'Hiragino Mincho ProN','Yu Mincho',serif">満</text></g>
    <text x="50" y="${H-64}" font-size="12" fill="#8A7358">サ道場 東海 — ${esc(EDITION)}</text></svg>`;
  const disp=svg.replace(/width="560" height="[\d.]+"/,'style="width:100%;height:auto;display:block"');
  openSheet(sheetHead("満願之証")+`<div style="border:1.5px solid var(--line);border-radius:12px;overflow:hidden">${disp}</div>
    <button class="btn primary" style="width:100%;margin-top:14px" id="certSave">画像として保存</button>`);
  document.getElementById("certSave").addEventListener("click",()=>{
    const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml;charset=utf-8"}));
    const img=new Image();
    img.onload=()=>{ const c=document.createElement("canvas"); c.width=img.width*2; c.height=img.height*2;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      const a=document.createElement("a"); a.href=c.toDataURL("image/png"); a.download=`sadojo-満願之証-${q.id}.png`; a.click();
      notify("保存しました"); };
    img.onerror=()=>{ URL.revokeObjectURL(url); notify("画像の生成に失敗しました。","err"); };
    img.src=url;
  });
};

/* ---------- 地図（東海。470sの方式：pointerupでelementFromPoint判定・ズーム後に再描画） ---------- */
let view=null, mapMoved=false, renderedW=0, mapInit=false, lastPos=null, curTab="dojo";
const _anchor={};
function prefAnchor(key){
  if(_anchor[key]) return _anchor[key];
  let best=null;
  for(const sub of SHAPES.prefs[key].split("M").slice(1)){
    const pts=[...sub.matchAll(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g)].map(m=>[+m[1],+m[2]]);
    if(pts.length<3) continue;
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys));
    if(!best||area>best.area) best={area,x:xs.reduce((a,b)=>a+b,0)/xs.length,y:ys.reduce((a,b)=>a+b,0)/ys.length};
  }
  return _anchor[key]=best||{x:-999,y:-999};
}
function renderMap(){
  const {minLng,maxLng,minLat,maxLat,W,H,pad}=SHAPES.meta;
  if(!view) view={x:TBOX.x,y:TBOX.y,w:TBOX.w,h:TBOX.h};
  renderedW=view.w;
  const zoom=TBOX.w/view.w;                 // 1=東海全体
  const zf=view.w/W;                        // かすれフィルタは470sと同じ全国基準
  const k=Math.cos(rad((minLat+maxLat)/2));
  const spanX=(maxLng-minLng)*k, spanY=maxLat-minLat;
  const px=f=>pad+((f.lng-minLng)*k)/spanX*(W-pad*2);
  const py=f=>pad+(maxLat-f.lat)/spanY*(H-pad*2);
  const u=view.w/100;                       // 画面幅1%ぶん（マーカーは画面基準）
  const mk=Math.min(2.4,Math.pow(zoom,0.35));   // ズームするほど少し育つ
  const z=v=>+(v*u).toFixed(2), zm=v=>+(v*u*mk).toFixed(2);
  const st=state.stamps;
  let s=`<svg id="mapsvg" viewBox="${view.x} ${view.y} ${view.w} ${view.h}">`;
  s+=`<defs>
    <pattern id="mgrid" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M9 0H0V9" fill="none" stroke="#EDDFC3" stroke-width="0.25"/>
    </pattern>
    <filter id="mrough" x="${TBOX.x-30}" y="${TBOX.y-30}" width="${TBOX.w+60}" height="${TBOX.h+60}" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="${(0.55/Math.sqrt(zf)).toFixed(3)}" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="${(1.3*zf).toFixed(3)}"/>
    </filter>
  </defs>`;
  s+=`<rect x="${TBOX.x-120}" y="${TBOX.y-120}" width="${TBOX.w+240}" height="${TBOX.h+240}" fill="#FBF1DC"/>`;
  s+=`<rect x="${TBOX.x-120}" y="${TBOX.y-120}" width="${TBOX.w+240}" height="${TBOX.h+240}" fill="url(#mgrid)"/>`;
  for(const key of REGION.prefs){
    const n=FAC.filter(f=>f.pref===key&&st[f.id]).length;
    s+=`<path d="${SHAPES.prefs[key]}" fill="${PREFC[key]}" fill-opacity="${(0.13+n*0.008).toFixed(3)}" stroke="#8A7358" stroke-width="0.7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  s+=`<path d="${SHAPES.biwa}" fill="#C6DCDF" stroke="#8FB0B6" stroke-width="0.6" vector-effect="non-scaling-stroke"/>`;
  for(const key of REGION.prefs){
    const c=prefAnchor(key);
    s+=`<text x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}" text-anchor="middle" font-size="${z(4.2)}" letter-spacing="${z(1)}" fill="#A08C72" opacity="0.85">${PREF_LABEL[key]}</text>`;
  }
  if(lastPos){
    const x=px(lastPos), y=py(lastPos);
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z(2.2)}" fill="none" stroke="#6F9A63" stroke-width="${z(0.6)}"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z(0.9)}" fill="#6F9A63"/>`;
  }
  const hitR=zm(zoom>2.5?3.4:2.3);          // 全体表示は誤爆しないよう絞る
  /* 台帳（自分で登録）＝角印 */
  for(const f of state.ufacs){
    const on=!!st[f.id], x=px(f), y=py(f);
    s+=`<g data-id="${f.id}" style="cursor:pointer"><rect x="${(x-hitR).toFixed(1)}" y="${(y-hitR).toFixed(1)}" width="${(hitR*2).toFixed(1)}" height="${(hitR*2).toFixed(1)}" fill="transparent"/>`;
    s+= on
      ? `<g filter="url(#mrough)" opacity="0.92" transform="rotate(-8 ${x.toFixed(1)} ${y.toFixed(1)})">
           <rect x="${(x-zm(1.7)).toFixed(1)}" y="${(y-zm(1.7)).toFixed(1)}" width="${zm(3.4)}" height="${zm(3.4)}" rx="${zm(0.4)}" fill="#D9483B"/>
           <rect x="${(x-zm(1)).toFixed(1)}" y="${(y-zm(1)).toFixed(1)}" width="${zm(2)}" height="${zm(2)}" fill="none" stroke="#FEF6E6" stroke-width="${zm(0.3)}"/>
         </g>`
      : `<rect x="${(x-zm(1.4)).toFixed(1)}" y="${(y-zm(1.4)).toFixed(1)}" width="${zm(2.8)}" height="${zm(2.8)}" fill="#FFFDF4" stroke="#A69374" stroke-width="${zm(0.55)}"/>`;
    s+=`</g>`;
  }
  /* 枠149湯＝丸印。行きたいは金 */
  for(const f of FAC){
    const on=!!st[f.id], want=!!state.wants[f.id], x=px(f), y=py(f);
    s+=`<g data-id="${f.id}" style="cursor:pointer"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hitR}" fill="transparent"/>`;
    s+= on
      ? `<g filter="url(#mrough)" opacity="0.92">
           <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${zm(1.9)}" fill="#D9483B"/>
           <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${zm(1.15)}" fill="none" stroke="#FEF6E6" stroke-width="${zm(0.28)}"/>
         </g>`
      : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${zm(1.35)}" fill="${want?"#FFF6DF":"#FFFDF4"}" stroke="${want?"#C7973F":PREFC[f.pref]}" stroke-width="${zm(want?0.7:0.5)}"/>`;
    s+=`</g>`;
  }
  s+=`</svg>`;
  document.getElementById("mapbox").innerHTML=s;
  bindMapGestures(document.getElementById("mapsvg"));
}
function bindMapGestures(svg){
  const ptrs=new Map();
  let start=null;
  const apply=()=>svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
  const clamp=()=>{
    view.w=Math.min(Math.max(view.w,TBOX.w/32),TBOX.w); view.h=view.w*TBOX.h/TBOX.w;
    view.x=Math.min(Math.max(view.x,TBOX.x-view.w*0.15),TBOX.x+TBOX.w-view.w*0.85);
    view.y=Math.min(Math.max(view.y,TBOX.y-view.h*0.15),TBOX.y+TBOX.h-view.h*0.85);
  };
  const toLocal=e=>{
    const r=svg.getBoundingClientRect();
    return { x:view.x+(e.clientX-r.left)/r.width*view.w, y:view.y+(e.clientY-r.top)/r.height*view.h, cx:e.clientX, cy:e.clientY };
  };
  svg.addEventListener("pointerdown",e=>{
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,toLocal(e));
    start={...view}; mapMoved=false;
  });
  svg.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId)) return;
    const cur=toLocal(e);
    if(ptrs.size===1){
      const p0=[...ptrs.values()][0];
      const dx=(cur.cx-p0.cx), dy=(cur.cy-p0.cy);
      if(Math.abs(dx)+Math.abs(dy)>6) mapMoved=true;
      const r=svg.getBoundingClientRect();
      view.x=start.x-dx/r.width*view.w; view.y=start.y-dy/r.height*view.h;
      clamp(); apply();
    } else if(ptrs.size===2){
      mapMoved=true;
      const ids=[...ptrs.keys()];
      const other=ptrs.get(ids[0]===e.pointerId?ids[1]:ids[0]);
      const prev=ptrs.get(e.pointerId);
      const dPrev=Math.hypot(prev.cx-other.cx, prev.cy-other.cy)||1;
      const dCur=Math.hypot(cur.cx-other.cx, cur.cy-other.cy)||1;
      const sc=dPrev/dCur;
      const midx=(cur.x+other.x)/2, midy=(cur.y+other.y)/2;
      view.w*=sc; view.h*=sc;
      view.x=midx-(midx-view.x)*sc; view.y=midy-(midy-view.y)*sc;
      clamp(); apply();
      ptrs.set(e.pointerId,cur);
    }
  });
  const up=e=>{
    const wasSingle = ptrs.size===1;
    ptrs.delete(e.pointerId);
    if(wasSingle && !mapMoved){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const g=el && el.closest ? el.closest("g[data-id]") : null;
      if(g) openFac(g.dataset.id);
    }
    if(ptrs.size===0 && Math.abs(view.w-renderedW)>0.5) setTimeout(()=>renderMap(),0);
    setTimeout(()=>{mapMoved=false;},50);
  };
  svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
  let wheelT=null;
  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const cur=toLocal(e); const sc=e.deltaY>0?1.15:0.87;
    view.w*=sc; view.h*=sc;
    view.x=cur.x-(cur.x-view.x)*sc; view.y=cur.y-(cur.y-view.y)*sc;
    clamp(); apply();
    clearTimeout(wheelT);
    wheelT=setTimeout(()=>{ if(Math.abs(view.w-renderedW)>0.5) renderMap(); },160);
  },{passive:false});
}
document.getElementById("mapReset").addEventListener("click",()=>{ view=null; renderMap(); });

/* タブ切り替え。地図は初回に描き、判子帳は開くたびに描く */
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  curTab=b.dataset.v;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  document.getElementById("dojoView").style.display = curTab==="dojo" ? "" : "none";
  document.getElementById("bookView").style.display = curTab==="book" ? "" : "none";
  document.getElementById("mapView").style.display = curTab==="map" ? "" : "none";
  if(curTab==="map" && !mapInit){ mapInit=true; renderMap(); }
  if(curTab==="book") renderBook();
}));

/* ---------- 枠外の施設を現在地で登録（台帳。お題には数えない） ---------- */
document.getElementById("regBtn").addEventListener("click",()=>{
  const btn=document.getElementById("regBtn");
  btn.disabled=true; btn.textContent="測位中…";
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.disabled=false; btn.textContent="現在地で施設を登録（枠外）";
    const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
    lastPos=p;
    const near=FAC.concat(state.ufacs).map(f=>({f,d:distance(p,f)})).sort((a,b)=>a.d-b.d)[0];
    openSheet(sheetHead("枠外の施設を登録")+`
      <p style="font-size:12px;color:var(--mid);line-height:1.8;margin:0 0 10px">いまいる場所（<span class="mono">${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span>）で登録し、そのまま押印します。お題には数えませんが、地図と押印数に残ります。</p>
      ${near&&near.d<=250?`<p style="font-size:11px;color:var(--stamp);margin:0 0 10px">近くに <b>${esc(near.f.name)}</b>（約${Math.round(near.d)}m）が登録済みです。同じ施設なら<button class="backbtn" style="font-size:11px" onclick="window.__fac('${near.f.id}')">こちらのカード</button>から押してください。</p>`:""}
      <input id="regName" placeholder="施設名" maxlength="40" style="width:100%;font-family:inherit;font-size:14px;padding:11px 13px;border:1.5px solid var(--line2);border-radius:11px;background:var(--panel);color:var(--text)">
      <button class="btn primary" style="width:100%;margin-top:10px" id="regSave">登録して押印</button>`);
    document.getElementById("regSave").addEventListener("click",()=>{
      const name=document.getElementById("regName").value.trim();
      if(!name){ notify("施設名を入れてください。","err"); return; }
      const nf={id:"u"+Date.now(), name, lat:p.lat, lng:p.lng, u:1};
      state.ufacs.push(nf); state.stamps[nf.id]=today();
      reindex(); save(); render(); closeSheet(); stampFx(nf);
    });
  },err=>{ btn.disabled=false; btn.textContent="現在地で施設を登録（枠外）"; notify("現在地を取得できませんでした。","err"); },
  {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
});

/* ---------- GPS押印 ---------- */
const questTargets=new Set(QUESTS.flatMap(q=>q.targets));
document.getElementById("stampBtn").addEventListener("click",()=>{
  const btn=document.getElementById("stampBtn");
  btn.disabled=true; btn.textContent="測位中…";
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.disabled=false; btn.textContent="現在地で押印";
    const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
    lastPos=p;
    const near=FAC.filter(f=>questTargets.has(f.id))
      .map(f=>({f,d:distance(p,f)})).filter(x=>x.d<=state.radius).sort((a,b)=>a.d-b.d);
    if(!near.length){
      const alls=FAC.map(f=>({f,d:distance(p,f)})).sort((a,b)=>a.d-b.d)[0];
      notify(`半径${state.radius}m以内に枠の施設なし。最寄りは ${alls.f.name}（約${Math.round(alls.d)}m）。枠外の湯は地図タブの「現在地で施設を登録」で残せます。`,"err");
    }else if(near.length===1){ toggleStampByGps(near[0].f); }
    else openSheet(sheetHead("どの施設にいますか？")+near.map(x=>
      `<button class="choosebtn" onclick="window.__gps('${x.f.id}')"><span>${esc(x.f.name)}</span><span class="d">${Math.round(x.d)}m</span></button>`).join(""));
  },err=>{ btn.disabled=false; btn.textContent="現在地で押印"; notify("現在地を取得できませんでした。","err"); },
  {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
});
function toggleStampByGps(f){ if(stamped(f.id)){ notify(`${f.name} は押印済みです`); return; } state.stamps[f.id]=today(); save(); render(); stampFx(f); }
window.__gps=id=>{ closeSheet(); toggleStampByGps(byId[id]); };

/* ---------- Sauna470sバックアップ取り込み ---------- */
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.state||!Array.isArray(d.state.visits)) throw new Error();
      let added=0;
      for(const v of [...d.state.visits].reverse()){
        if(byId[v.facilityId] && !state.stamps[v.facilityId]){ state.stamps[v.facilityId]=v.date||today(); added++; }
      }
      save(); render();
      notify(added?`${added}湯ぶんの押印を取り込みました`:"新しく取り込める押印はありませんでした（既に反映済み）");
    }catch{ notify("読み込めませんでした。Sauna470sで書き出したファイルを選んでください。","err"); }
  };
  r.readAsText(file); e.target.value="";
});

/* ---------- 通知・設定 ---------- */
let ntfT;
function notify(msg,kind){
  const el=document.getElementById("notice");
  el.className="notice"+(kind==="err"?" err":""); el.textContent=msg; el.style.display="block";
  clearTimeout(ntfT); ntfT=setTimeout(()=>el.style.display="none",5000);
}
const radEl=document.getElementById("radius");
radEl.value=state.radius;
const radLabel=()=>document.getElementById("radlabel").textContent=`GPS判定半径 — ${state.radius}m`;
radLabel();
radEl.addEventListener("input",()=>{ state.radius=+radEl.value; radLabel(); save(); });

render();
document.getElementById("chgrid").innerHTML=Object.entries(CHARS).map(([k,n])=>
  `<figure><img src="art/ch-${k}.webp" loading="lazy" alt="${esc(n)}"><figcaption>${esc(n)}</figcaption></figure>`).join("");
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js?v="+APP_VERSION).catch(()=>{});
