<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FEF6E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>SAUNA 30</title>
<style>
  :root{
    --ground:#FEF6E6; --panel:#FFFFF8; --line:#EADCC2; --line2:#D9C6A4;
    --text:#4A3B2E; --mid:#75634F; --muted:#A08C72;
    --ok:#6F9A63; --hot:#C8553D; --cold:#5B87A5;
    --stamp:#D9483B; --gold:#C7973F; --cream:#FFF8EC;
    --free:#A69374;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);
    font-family:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","HG Maru Gothic M-PRO","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:44px}
  .mono{font-family:ui-monospace,"SF Mono","Roboto Mono",monospace}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px}
  header{padding:calc(24px + env(safe-area-inset-top)) 0 14px;border-bottom:2px dashed var(--line2)}
  .hrow{display:flex;justify-content:space-between;align-items:baseline}
  h1{font-size:17px;font-weight:800;letter-spacing:.24em;margin:0;color:var(--text)}
  .edition{font-size:9.5px;color:var(--muted);letter-spacing:.1em}
  .sub{margin:8px 0 0;font-size:12px;color:var(--mid);line-height:1.7}
  .reglist{margin-top:14px}
  .regbox{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;margin-top:6px;
    overflow:hidden;box-shadow:0 1px 0 rgba(74,59,46,.05)}
  .reghead{width:100%;display:grid;grid-template-columns:1fr 60px auto 14px;align-items:center;gap:9px;
    padding:8px 12px;background:none;border:none;color:var(--text);font-size:12px;font-weight:700;text-align:left}
  .reghead .num{font-family:ui-monospace,monospace;font-size:13px;font-weight:400;text-align:right}
  .reghead .num small{color:var(--muted);font-size:10px}
  .reghead .bar{margin-top:0;display:block}
  .reghead .cv{color:var(--muted);font-size:12px;text-align:center}
  .prefgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:2px 10px 11px}
  .prefcell{background:#FFFDF4;padding:8px 9px;border:1.5px solid var(--line);border-radius:10px}
  .prefcell .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;gap:4px}
  .prefcell .num{font-family:ui-monospace,monospace;font-size:12px}
  .prefcell .num small{color:var(--muted);font-size:9px}
  .bar{height:4px;background:#F2E6CC;margin-top:9px;border-radius:3px;overflow:hidden}
  .bar>div{height:100%;border-radius:3px;transition:width .3s}
  .actions{display:flex;gap:10px;margin-top:16px;align-items:center}
  button{font-family:inherit;cursor:pointer}
  .btn{font-size:13px;font-weight:600;padding:11px 16px;border-radius:12px;border:1.5px solid var(--line2);
    background:var(--panel);color:var(--text)}
  .btn.primary{background:var(--stamp);color:var(--cream);border-color:var(--stamp);
    box-shadow:0 2px 0 rgba(74,59,46,.15)}
  .btn:disabled{opacity:.4}
  .total{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
  .notice{margin-top:13px;padding:11px 13px;border:1.5px solid var(--line);border-left:3px solid var(--ok);
    background:var(--panel);font-size:12.5px;line-height:1.7;color:var(--mid);border-radius:10px}
  .notice.err{border-left-color:var(--stamp)}
  nav{display:flex;gap:20px;margin-top:26px;border-bottom:1.5px solid var(--line)}
  nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
    font-size:12px;font-weight:700;letter-spacing:.12em;padding:0 0 9px;margin-bottom:-1.5px}
  nav button.on{color:var(--text);border-bottom-color:var(--stamp)}
  .pane{margin-top:16px;display:none}
  .pane.on{display:block}
  #mapbox{border:1.5px solid var(--line2);border-radius:14px;overflow:hidden;background:#FBF1DC}
  #mapbox svg{width:100%;display:block;touch-action:none}
  .maptools{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .legend{display:flex;gap:12px;font-size:10px;color:var(--muted);flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px}
  .dotchip{width:9px;height:9px;border-radius:5px;display:inline-block}
  .sqchip{width:9px;height:9px;border-radius:2px;display:inline-block}
  .maphint{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:12px}
  .seg{display:flex;border:1.5px solid var(--line2);border-radius:12px;margin-bottom:12px;
    background:var(--panel);padding:3px;gap:3px}
  .seg button{flex:1;background:transparent;border:none;border-radius:9px;color:var(--muted);
    font-size:12px;font-weight:600;padding:8px 0}
  .seg button.on{background:var(--text);color:var(--cream)}
  .filters{margin-bottom:14px}
  .frow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .frow::-webkit-scrollbar{display:none}
  .frow+.frow{margin-top:7px}
  .filters button{border:1.5px solid var(--line2);background:var(--panel);color:var(--mid);white-space:nowrap;
    border-radius:999px;font-size:12px;font-weight:600;padding:6px 13px;flex-shrink:0}
  .filters button.on{background:var(--text);color:var(--cream);border-color:var(--text)}
  .frow.sub button{font-size:11.5px;padding:5px 11px}
  .card{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--panel);
    border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:8px;color:var(--text);
    box-shadow:0 1px 0 rgba(74,59,46,.05)}
  .rank{font-family:ui-monospace,monospace;font-size:11px;width:42px;flex-shrink:0;line-height:1.3}
  .dot{width:11px;height:11px;border-radius:6px;border:1.5px solid var(--muted);flex-shrink:0;margin:0 5px}
  .dot.sq{border-radius:3px}
  .hanko{width:21px;height:21px;border-radius:50%;border:1.5px solid var(--stamp);color:var(--stamp);
    background:rgba(217,72,59,.08);display:flex;align-items:center;justify-content:center;
    font-size:9.5px;font-weight:700;flex-shrink:0;transform:rotate(-8deg)}
  .hanko.sq{border-radius:5px}
  .card .body{flex:1;min-width:0}
  .card .name{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .meta{font-family:ui-monospace,monospace;font-size:10px;color:var(--muted)}
  .card .best{font-family:ui-monospace,monospace;font-size:13px;color:var(--mid);flex-shrink:0}
  .card .best small{font-size:9px;color:var(--muted)}
  .logitem{border-bottom:1.5px dashed var(--line2);padding:13px 2px}
  .logitem .top{display:flex;justify-content:space-between;align-items:baseline}
  .logitem .meta{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--muted);display:flex;gap:12px;margin-top:7px;flex-wrap:wrap}
  .logitem .memo{margin:8px 0 0;font-size:13px;color:var(--mid);line-height:1.75}
  .photorow{display:flex;gap:6px;margin-top:9px;overflow-x:auto}
  .photorow img{height:64px;border-radius:8px;border:1.5px solid var(--line);flex-shrink:0}
  .empty{border:1.5px dashed var(--line2);border-radius:14px;padding:24px 18px;font-size:13px;color:var(--muted);line-height:1.85;background:var(--panel)}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:var(--muted)}
  .settext{font-size:12px;color:var(--mid);line-height:1.85;margin:8px 0 0}
  .spectbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:9px}
  .spectbl th,.spectbl td{border:1px solid var(--line);padding:6px 6px;text-align:center;font-weight:400;color:var(--mid)}
  .spectbl th{background:#FBF1DC;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.02em}
  .spectbl td.k{background:#FBF1DC;font-size:10.5px;color:var(--muted);font-weight:700;width:38px}
  .infolist{font-size:11.5px;color:var(--mid);line-height:1.85;margin-top:9px}
  .infolist div{display:flex;gap:9px}
  .infolist b{color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.08em;flex-shrink:0;width:52px;padding-top:2px}
  .linkrow{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .linkrow a{font-size:11.5px;color:var(--mid);border:1.5px solid var(--line2);border-radius:999px;
    padding:5px 12px;text-decoration:none;background:#FFFDF4}
  input[type=range]{width:100%;accent-color:var(--hot)}
  .overlay{position:fixed;inset:0;background:rgba(74,59,46,.38);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.on{display:flex}
  .sheet{background:var(--panel);width:100%;max-width:520px;max-height:90vh;
    overflow-y:auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;
    box-shadow:0 -6px 24px rgba(74,59,46,.18)}
  .sheet .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .xbtn{background:none;border:none;color:var(--muted);font-size:20px;line-height:1}
  .field{display:block;margin-bottom:16px}
  .field .eyebrow{margin-bottom:6px}
  .input{width:100%;background:#FFFDF4;border:1.5px solid var(--line2);border-radius:10px;color:var(--text);
    font-family:inherit;font-size:15px;padding:10px 12px;outline:none}
  textarea.input{min-height:72px;resize:vertical;line-height:1.7}
  .slidelabel{font-family:ui-monospace,monospace;font-size:11px;margin-bottom:5px;display:flex;justify-content:space-between}
  .axis{margin-bottom:13px}
  .scoretotal{font-family:ui-monospace,monospace;font-size:22px;text-align:right;margin:4px 0 14px}
  .scoretotal small{font-size:10px;color:var(--muted)}
  .tempsrow{display:flex;gap:14px;margin-bottom:14px}
  .tempsrow>div{flex:1}
  .stars{display:flex;gap:6px;margin-bottom:14px}
  .stars button{background:none;border:none;font-size:22px;color:var(--line2);padding:2px}
  .stars button.on{color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1.5px solid var(--line2);background:var(--panel);color:var(--mid);border-radius:999px;font-size:11.5px;padding:6px 12px}
  .chip.on{border-color:var(--stamp);color:var(--stamp);background:rgba(217,72,59,.07)}
  .choosebtn{display:flex;justify-content:space-between;width:100%;background:#FFFDF4;border:1.5px solid var(--line2);
    border-radius:12px;padding:13px 14px;margin-bottom:8px;color:var(--text);font-size:14px}
  .choosebtn .d{font-family:ui-monospace,monospace;font-size:11px;color:var(--muted)}
  .axisbars{margin:12px 0 4px}
  .axisbars .ab{display:flex;align-items:center;gap:10px;margin-bottom:7px}
  .axisbars .ab .n{font-size:11px;color:var(--mid);width:84px;flex-shrink:0}
  .axisbars .ab .t{font-family:ui-monospace,monospace;font-size:11px;width:22px;text-align:right}
  .axisbars .ab .bar{flex:1;margin-top:0}
  .rowbtns{display:flex;gap:10px}
  .wantbtn{border:1.5px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:12px;font-size:12px;font-weight:600;padding:8px 12px}
  .wantbtn.on{color:var(--gold);border-color:var(--gold)}
  /* 押印エフェクト */
  #stampfx{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;z-index:80;pointer-events:none;opacity:1;transition:opacity .45s}
  #stampfx.on{display:flex}
  #stampfx.bye{opacity:0}
  #stampfx .seal{animation:stamp-press .55s cubic-bezier(.2,1.1,.3,1) both;
    filter:drop-shadow(0 3px 8px rgba(74,59,46,.25))}
  #stampfx .fxname{font-size:14px;font-weight:700;color:var(--text);background:rgba(255,255,248,.92);
    padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);animation:fxname-in .4s .3s both}
  @keyframes stamp-press{
    0%{transform:scale(2.6) rotate(-18deg);opacity:0}
    55%{transform:scale(.92) rotate(-7deg);opacity:1}
    72%{transform:scale(1.06) rotate(-7deg)}
    100%{transform:scale(1) rotate(-7deg)}
  }
  @keyframes fxname-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><h1>SAUNA&nbsp;30</h1><span class="mono edition" id="edition"></span></div>
    <p class="sub">県ごとのイキタイTOP10を踏破する — 全国版</p>
  </header>

  <div class="reglist" id="prefgrid"></div>

  <div class="actions">
    <button class="btn primary" id="stampBtn" style="flex:1">現在地でスタンプ</button>
    <span class="total" id="total"></span>
  </div>

  <div id="notice" style="display:none"></div>

  <nav id="tabs">
    <button data-tab="map" class="on">地図</button>
    <button data-tab="list">施設</button>
    <button data-tab="log">履歴</button>
    <button data-tab="set">設定</button>
  </nav>

  <div class="pane on" id="pane-map">
    <div id="mapbox"></div>
    <div class="maptools">
      <div class="legend">
        <span><i class="dotchip" style="border:1.5px solid var(--muted)"></i>枠（県ごとの色）</span>
        <span><i class="sqchip" style="border:1.5px solid var(--free)"></i>台帳</span>
        <span><i class="dotchip" style="background:var(--stamp);transform:rotate(-8deg)"></i>押印済</span>
      </div>
      <button class="btn" id="mapReset" style="padding:5px 10px;font-size:11px">全体</button>
    </div>
    <p class="maphint">ピンチで拡大、ドラッグで移動。点をタップすると施設詳細。</p>
  </div>

  <div class="pane" id="pane-list">
    <div class="seg" id="seg">
      <button data-s="frame" class="on" id="segFrame">枠</button>
      <button data-s="free">台帳</button>
      <button data-s="want">行きたい</button>
    </div>
    <div class="filters" id="filters"></div>
    <div id="listbox"></div>
    <button class="btn" id="addFreeBtn" style="width:100%;margin-top:6px;display:none">＋ 台帳に施設を登録</button>
  </div>

  <div class="pane" id="pane-log"><div id="logbox"></div></div>

  <div class="pane" id="pane-set">
    <div class="eyebrow" id="radlabel"></div>
    <input type="range" min="100" max="1000" step="50" id="radius">
    <p class="settext">複数施設が半径内に入った場合は候補から選択します。</p>
    <div style="border-top:1px solid var(--line);padding-top:16px;margin-top:22px">
      <div class="eyebrow">採点の物差し</div>
      <p class="settext">サウナ室・水風呂・外気浴/休憩・清潔/雰囲気 各25点＋特別加減点±10（理由必須）。基準：竜泉寺の湯 ≒ 82。整いは訪問ごとの☆で別記録。</p>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:16px;margin-top:22px">
      <div class="eyebrow">この版について</div>
      <p class="settext" id="editionNote"></p>
    </div>
    <div style="border-top:1px solid var(--line);padding-top:16px;margin-top:22px">
      <div class="eyebrow">データ</div>
      <p class="settext">記録と写真はこの端末のブラウザに保存されます。バックアップ：</p>
      <div class="rowbtns" style="margin-top:10px">
        <button class="btn" id="exportBtn" style="flex:1">書き出し</button>
        <button class="btn" id="importBtn" style="flex:1">読み込み</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="stampfx" aria-hidden="true"></div>

<script>

const EDITION = "2026.08.06版";
const REGIONS = [
  ["北海道・東北",["hokkaido","aomori","iwate","miyagi","akita","yamagata","fukushima"]],

/* ---------- geo ---------- */
const R=6371000, rad=d=>d*Math.PI/180;
function distance(a,b){
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
const fmtDist = m => m<1000 ? Math.round(m)+"m" : (m/1000).toFixed(1)+"km";
function getPosition(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){ rej(new Error("この端末では位置情報を取得できません。")); return; }
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>rej(new Error(e.code===1?"位置情報が許可されていません。施設詳細から手動スタンプが使えます。":"現在地を取得できませんでした。")),
      {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  });
}

const dbp = new Promise((res,rej)=>{
  const rq = indexedDB.open("sauna30",1);
  rq.onupgradeneeded = () => rq.result.createObjectStore("photos");
  rq.onsuccess = () => res(rq.result);
  rq.onerror = () => rej(rq.error);
});
async function photoPut(id, blob){ const db=await dbp; return new Promise((res,rej)=>{ const tx=db.transaction("photos","readwrite"); tx.objectStore("photos").put(blob,id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function photoGet(id){ const db=await dbp; return new Promise((res,rej)=>{ const rq=db.transaction("photos").objectStore("photos").get(id); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }
async function photoAllKeys(){ const db=await dbp; return new Promise((res,rej)=>{ const rq=db.transaction("photos").objectStore("photos").getAllKeys(); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function compress(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const max = 1280, sc = Math.min(1, max/Math.max(img.width,img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
  cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
  URL.revokeObjectURL(url);
  return new Promise(res=>cv.toBlob(res,"image/jpeg",0.82));
}

let view=null, mapMoved=false, renderedW=0;
/* 県名ラベルの置き位置＝最大サブパスの重心（SHAPESは投影済みpx、沖縄インセットもそのまま） */
const _anchor={};
function prefAnchor(key){
  if(_anchor[key]) return _anchor[key];
  let best=null;
  for(const sub of SHAPES.prefs[key].split("M").slice(1)){
    const pts=[...sub.matchAll(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g)].map(m=>[+m[1],+m[2]]);
    if(pts.length<3) continue;
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    const area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys));
    if(!best||area>best.area) best={area,x:xs.reduce((a,b)=>a+b,0)/xs.length,y:ys.reduce((a,b)=>a+b,0)/ys.length};
  }
  return _anchor[key]=best||{x:-999,y:-999};
}
function renderMap(){
  const st=stamped();
  const {minLng,maxLng,minLat,maxLat,W,H,pad,okiS,okiAx,okiAy,okiBox,okiMaxLng,okiMaxLat}=SHAPES.meta;
  if(!view) view={x:0,y:0,w:W,h:H};
  const zf=view.w/W; renderedW=view.w; // マーカーは画面サイズ一定（ズーム後に再描画）
  const k=Math.cos(rad((minLat+maxLat)/2));
  const spanX=(maxLng-minLng)*k, spanY=maxLat-minLat;
  const inOki=f=>f.lng<okiMaxLng&&f.lat<okiMaxLat;
  const px=f=>{const x=pad+((f.lng-minLng)*k)/spanX*(W-pad*2);return inOki(f)?x*okiS+okiAx:x;};
  const py=f=>{const y=pad+(maxLat-f.lat)/spanY*(H-pad*2);return inOki(f)?y*okiS+okiAy:y;};
  const onMap=f=>inOki(f)||(f.lat<=maxLat&&f.lat>=minLat&&f.lng>=minLng&&f.lng<=maxLng);
  let s=`<svg id="mapsvg" viewBox="${view.x} ${view.y} ${view.w} ${view.h}">`;
  s+=`<defs>
    <pattern id="mgrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#EDDFC3" stroke-width="0.6"/>
    </pattern>
    <filter id="mrough" x="0" y="0" width="${W}" height="${H}" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="${(0.55/Math.sqrt(zf)).toFixed(3)}" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="${(1.3*zf).toFixed(3)}"/>
    </filter>
  </defs>`;
  s+=`<rect x="${-W}" y="${-H}" width="${W*3}" height="${H*3}" fill="#FBF1DC"/>`;
  s+=`<rect x="${-W}" y="${-H}" width="${W*3}" height="${H*3}" fill="url(#mgrid)"/>`;
  for(const key in SHAPES.prefs){
    const p=PREF[key];
    const n=p?FRAME.filter(f=>f.pref===key&&st.has(f.id)).length:0;
    s+=`<path d="${SHAPES.prefs[key]}" fill="${p?p.color:"#C7A876"}" fill-opacity="${(p?0.14+n*0.015:0.08).toFixed(3)}" stroke="#8A7358" stroke-width="0.7" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  }
  s+=`<path d="${SHAPES.biwa}" fill="#C6DCDF" stroke="#8FB0B6" stroke-width="0.6" vector-effect="non-scaling-stroke"/>`;
  s+=`<line x1="${(okiBox[2]+18).toFixed(1)}" y1="${pad}" x2="${pad}" y2="${(okiBox[3]+16).toFixed(1)}" stroke="#C9B58F" stroke-width="0.8" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/>`;
  /* 県名は拡大時のみ（全国表示で47枚並べると潰れるため） */
  if(zf<=0.55){
    const fs=8*zf, inView=c=>c.x>=view.x&&c.x<=view.x+view.w&&c.y>=view.y&&c.y<=view.y+view.h;
    for(const key in SHAPES.prefs){
      const p=PREF[key]; if(!p) continue;   // 県パック未収録の県は枠が無いのでラベルも出さない
      const c=prefAnchor(key); if(!inView(c)) continue;
      s+=`<text x="${c.x.toFixed(1)}" y="${c.y.toFixed(1)}" text-anchor="middle" font-size="${fs.toFixed(2)}" letter-spacing="${(fs*0.24).toFixed(2)}" fill="#A08C72">${p.label}</text>`;
    }
  }
  s+=`<text x="${(okiBox[0]+4).toFixed(1)}" y="${(okiBox[1]-5).toFixed(1)}" font-size="${(5*Math.min(1,zf)).toFixed(2)}" letter-spacing="1.5" fill="#A08C72">沖縄</text>`;
  const z=v=>+(v*zf).toFixed(2);
  /* 470枠あるので全国表示ではタップ判定を絞る（重なり誤爆対策。拡大すれば元の広さ） */
  const hitR=z(zf>0.6?6.5:11);
  if(lastPos && onMap(lastPos)){
    s+=`<circle cx="${px(lastPos).toFixed(1)}" cy="${py(lastPos).toFixed(1)}" r="${z(3)}" fill="none" stroke="#6F9A63" stroke-width="${z(1)}"/><circle cx="${px(lastPos).toFixed(1)}" cy="${py(lastPos).toFixed(1)}" r="${z(1.2)}" fill="#6F9A63"/>`;
  }
  // 台帳施設（四角＝角印）
  for(const f of state.userFacilities){
    if(!onMap(f)) continue;
    const on=st.has(f.id), x=px(f), y=py(f);
    s+=`<g data-id="${f.id}" style="cursor:pointer"><rect x="${(x-z(6)).toFixed(1)}" y="${(y-z(6)).toFixed(1)}" width="${z(12)}" height="${z(12)}" fill="transparent"/>`;
    s+= on
      ? `<g filter="url(#mrough)" opacity="0.92" transform="rotate(-8 ${x.toFixed(1)} ${y.toFixed(1)})">
           <rect x="${(x-z(3.1)).toFixed(1)}" y="${(y-z(3.1)).toFixed(1)}" width="${z(6.2)}" height="${z(6.2)}" rx="${z(0.8)}" fill="#D9483B"/>
           <rect x="${(x-z(1.9)).toFixed(1)}" y="${(y-z(1.9)).toFixed(1)}" width="${z(3.8)}" height="${z(3.8)}" fill="none" stroke="#FEF6E6" stroke-width="${z(0.5)}"/>
         </g>`
      : `<rect x="${(x-z(2.5)).toFixed(1)}" y="${(y-z(2.5)).toFixed(1)}" width="${z(5)}" height="${z(5)}" fill="#FFFDF4" stroke="#A08C72" stroke-width="${z(1.1)}"/>`;
    s+=`</g>`;
  }
  // 枠施設（丸＝朱印）
  for(const f of FRAME){
    const col=PREF[f.pref].color, on=st.has(f.id), x=px(f), y=py(f);
    s+=`<g data-id="${f.id}" style="cursor:pointer"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hitR}" fill="transparent"/>`;
    s+= on
      ? `<g filter="url(#mrough)" opacity="0.92">
           <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z(4.6)}" fill="#D9483B"/>
           <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z(2.9)}" fill="none" stroke="#FEF6E6" stroke-width="${z(0.55)}"/>
         </g>`
      : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${z(3)}" fill="#FFFDF4" stroke="${col}" stroke-width="${z(1.3)}"/>`;
    s+=`</g>`;
  }
  s+=`</svg>`;
  const box=document.getElementById("mapbox");
  box.innerHTML=s;
  bindMapGestures(document.getElementById("mapsvg"));
}
function bindMapGestures(svg){
  const {W,H}=SHAPES.meta;
  const ptrs=new Map();
  let start=null;
  const apply=()=>svg.setAttribute("viewBox",`${view.x} ${view.y} ${view.w} ${view.h}`);
  const clamp=()=>{
    view.w=Math.min(Math.max(view.w,W/64),W); view.h=view.w*H/W;
    view.x=Math.min(Math.max(view.x,-view.w*0.2),W-view.w*0.8);
    view.y=Math.min(Math.max(view.y,-view.h*0.2),H-view.h*0.8);
  };
  const toLocal=e=>{
    const r=svg.getBoundingClientRect();
    return { x:view.x+(e.clientX-r.left)/r.width*view.w, y:view.y+(e.clientY-r.top)/r.height*view.h, cx:e.clientX, cy:e.clientY };
  };
  svg.addEventListener("pointerdown",e=>{
    svg.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,toLocal(e));
    start={...view}; mapMoved=false;
  });
  svg.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId)) return;
    const cur=toLocal(e);
    if(ptrs.size===1){
      const p0=[...ptrs.values()][0];
      const dx=(cur.cx-p0.cx), dy=(cur.cy-p0.cy);
      if(Math.abs(dx)+Math.abs(dy)>6) mapMoved=true;
      const r=svg.getBoundingClientRect();
      view.x=start.x-dx/r.width*view.w; view.y=start.y-dy/r.height*view.h;
      clamp(); apply();
    } else if(ptrs.size===2){
      mapMoved=true;
      const ids=[...ptrs.keys()];
      const other=ptrs.get(ids[0]===e.pointerId?ids[1]:ids[0]);
      const d0=Math.hypot(other.cx-[...ptrs.values()].find(p=>p!==other).cx||1,1); // placeholder, recompute below
      // 2点ピンチ：保存座標と現座標で単純スケール
      const prev=ptrs.get(e.pointerId);
      const dPrev=Math.hypot(prev.cx-other.cx, prev.cy-other.cy)||1;
      const dCur=Math.hypot(cur.cx-other.cx, cur.cy-other.cy)||1;
      const sc=dPrev/dCur;
      const midx=(cur.x+other.x)/2, midy=(cur.y+other.y)/2;
      view.w*=sc; view.h*=sc;
      view.x=midx-(midx-view.x)*sc; view.y=midy-(midy-view.y)*sc;
      clamp(); apply();
      ptrs.set(e.pointerId,cur);
      return;
    }
  });
  const up=e=>{
    const wasSingle = ptrs.size===1;
    ptrs.delete(e.pointerId);
    if(wasSingle && !mapMoved){
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const g=el && el.closest ? el.closest("g[data-id]") : null;
      if(g) openDetail(g.dataset.id);
    }
    if(ptrs.size===0 && Math.abs(view.w-renderedW)>0.5) setTimeout(()=>renderMap(),0); // ズーム後にマーカーを描き直し
    setTimeout(()=>{mapMoved=false;},50);
  };
  svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
  let wheelT=null;
  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const cur=toLocal(e); const sc=e.deltaY>0?1.15:0.87;
    view.w*=sc; view.h*=sc;
    view.x=cur.x-(cur.x-view.x)*sc; view.y=cur.y-(cur.y-view.y)*sc;
    clamp(); apply();
    clearTimeout(wheelT);
    wheelT=setTimeout(()=>{ if(Math.abs(view.w-renderedW)>0.5) renderMap(); },160);
  },{passive:false});
}

/* ---------- 履歴 ---------- */
function renderLog(){
  const box=document.getElementById("logbox");
  if(!state.visits.length){ box.innerHTML=`<div class="empty">スタンプの記録がここに並びます。</div>`; return; }
  box.innerHTML=state.visits.map(v=>{
    const f=byId(v.facilityId); if(!f) return "";
    const isFree=!f.pref, col=isFree?"#A69374":PREF[f.pref].color;
    const t=vTotal(v);
    const stars=v.totonoi?`<span style="color:#C7973F">★${v.totonoi}</span>`:"";
    return `<div class="logitem">
      <div class="top"><span style="font-size:14px"><span class="mono" style="color:${col};font-size:10px;margin-right:8px">${isFree?"台帳":PREF[f.pref].short+f.rank}</span>${esc(f.name)}</span>
      <span class="mono" style="font-size:10px;color:var(--muted)">${esc(v.date)}</span></div>
      <div class="meta"><span>${nthOf(v)}回目</span>${t!=null?`<span>${t}点${v.axes?"":"（旧）"}</span>`:""}${stars}
        ${v.hot!=null?`<span><span style="color:var(--hot)">${v.hot}°</span>→<span style="color:var(--cold)">${v.cold}°</span></span>`:""}
        ${v.adj?`<span>${v.adj>0?"+":""}${v.adj} ${esc(v.adjReason)}</span>`:""}
        <span>${v.method==="gps"?"GPS":"手動"}</span></div>
      ${v.memo?`<p class="memo">${esc(v.memo)}</p>`:""}
      ${v.photos&&v.photos.length?`<div class="photorow">${v.photos.map(p=>`<img data-photo="${p}" alt="">`).join("")}</div>`:""}
    </div>`;
  }).join("");
  fillPhotos(box);
}

function renderAll(){ renderHeader(); renderMap(); renderList(); renderLog(); }

/* ---------- シート ---------- */
const overlay=document.getElementById("overlay"), sheetEl=document.getElementById("sheet");
function openSheet(html){ sheetEl.innerHTML=html; overlay.classList.add("on"); sheetEl.scrollTop=0; }
function closeSheet(){ overlay.classList.remove("on"); }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeSheet(); });
const sheetHead=t=>`<div class="shead"><span class="eyebrow">${esc(t)}</span><button class="xbtn" onclick="window.__close()">×</button></div>`;
window.__close=closeSheet;

/* ---------- 施設詳細 ---------- */
function openDetail(id){
  const f=byId(id); if(!f) return;
  const isFree=!f.pref;
  const vs=visitsOf(id), sc=fScore(id);
  const tags=state.tags[id]||[];
  const axisBars = sc && sc.v.axes
    ? `<div class="axisbars">`+AXES.map(([k,label])=>{
        const val=sc.v.axes[k]||0;
        return `<div class="ab"><span class="n">${label}</span><div class="bar"><div style="width:${val*4}%;background:${isFree?"#A69374":PREF[f.pref].color}"></div></div><span class="t mono">${val}</span></div>`;
      }).join("")+
      (sc.v.adj?`<div class="ab"><span class="n">特別加減点</span><span class="mono" style="font-size:11px;color:var(--mid)">${sc.v.adj>0?"+":""}${sc.v.adj} ${esc(sc.v.adjReason)}</span></div>`:"")+`</div>`
    : "";
  /* 枠施設のスペック・営業情報（サウナイキタイ由来。版の時点のスナップショット） */
  const sp=[["m","男"],["w","女"],["u","共用"]].filter(([k])=>f[k]);
  const yn=v=>v==null?"—":(v?"有":"無");
  const specTbl = sp.length
    ? `<table class="spectbl"><tr><th></th><th>サウナ室</th><th>水風呂</th><th>外気浴</th><th>ロウリュ</th></tr>`
      +sp.map(([k,l])=>{const a=f[k];
        return `<tr><td class="k">${l}</td>
          <td style="color:var(--hot)">${a[0]==null?"—":a[0]+"°"}</td>
          <td style="color:var(--cold)">${a[1]==null?"—":a[1]+"°"}</td>
          <td>${yn(a[2])}</td><td>${yn(a[3])}</td></tr>`;}).join("")
      +`</table>`
    : "";
  const info=[f.hours?["営業時間",f.hours]:null,f.off?["定休日",f.off]:null,
              f.fee?["料金",f.fee.toLocaleString()+"円〜"]:null]
    .filter(Boolean).map(([k,v])=>`<div><b>${k}</b><span>${esc(v)}</span></div>`).join("");
  const facBlock = (specTbl||info||f.sid)
    ? `<div style="margin:14px 0"><div class="eyebrow" style="margin-bottom:2px">施設情報</div>
        ${specTbl}${info?`<div class="infolist">${info}</div>`:""}
        ${info?`<p style="font-size:10px;color:var(--muted);margin:7px 0 0;line-height:1.6">営業情報は${esc(EDITION)}時点の参考値です。おでかけ前に公式で確認を。</p>`:""}
        ${f.sid?`<div class="linkrow">
          <a href="https://sauna-ikitai.com/saunas/${f.sid}" target="_blank" rel="noopener">サウナイキタイ ↗</a>
          ${f.hp?`<a href="${esc(f.hp)}" target="_blank" rel="noopener">公式サイト ↗</a>`:""}</div>`:""}
      </div>`
    : "";
  const recs = vs.length
    ? vs.map(v=>{
        const t=vTotal(v);
        return `<div style="margin-top:9px">
          <div class="mono" style="font-size:11.5px;color:var(--mid);display:flex;gap:12px;flex-wrap:wrap">
          <span>${esc(v.date)}</span><span>${nthOf(v)}回目</span>${t!=null?`<span>${t}点${v.axes?"":"（旧）"}</span>`:""}
          ${v.totonoi?`<span style="color:#C7973F">★${v.totonoi}</span>`:""}
          ${v.hot!=null?`<span><span style="color:var(--hot)">${v.hot}°</span>/<span style="color:var(--cold)">${v.cold}°</span></span>`:""}</div>
          ${v.photos&&v.photos.length?`<div class="photorow">${v.photos.map(p=>`<img data-photo="${p}" alt="">`).join("")}</div>`:""}
        </div>`;
      }).join("")
    : `<p style="font-size:13px;color:var(--muted);margin:8px 0 0">未踏破。</p>`;
  openSheet(sheetHead(isFree?"台帳":`${PREF[f.pref].label} ${f.rank}位`)+`
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div style="font-size:17px">${esc(f.name)}</div>
      ${sc?`<div class="mono" style="font-size:20px">${sc.t}<small style="font-size:10px;color:var(--muted)">${sc.legacy?" 旧":""}</small></div>`:""}
    </div>
    <div class="mono" style="font-size:11px;color:var(--muted);margin:4px 0 12px">
      ${esc(f.city||"")}${f.ikitai?` · イキタイ ${f.ikitai.toLocaleString()}`:""}${f.sakatsu?` · サ活 ${f.sakatsu.toLocaleString()}`:""}${f.note?" · "+esc(f.note):""}${vs.length?` · ${vs.length}回訪問`:""}</div>
    ${axisBars}
    ${facBlock}
    <div style="margin:14px 0"><div class="eyebrow" style="margin-bottom:8px">タグ</div>
      <div class="chips">${TAGSET.concat(state.customTags||[]).map(t=>`<button class="chip ${tags.includes(t)?"on":""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}<button class="chip" id="tagAdd">＋追加</button></div>
    </div>
    <div style="margin:16px 0 6px"><div class="eyebrow">記録</div>${recs}</div>
    <div class="rowbtns" style="margin-top:16px">
      <button class="btn primary" style="flex:1" onclick="window.__checkin('${f.id}','manual')">手動でスタンプ</button>
      <button class="wantbtn ${state.wants.includes(f.id)?"on":""}" id="wantT">◇ 行きたい</button>
      <button class="btn" onclick="window.__maps(${f.lat},${f.lng})">地図</button>
    </div>
    ${isFree?`<button class="btn" style="width:100%;margin-top:10px;color:var(--hot)" onclick="window.__delFree('${f.id}')">この施設を台帳から削除</button>`:""}
  `);
  const addBtn=document.getElementById("tagAdd");
  if(addBtn) addBtn.addEventListener("click",()=>{
    const t=(prompt("新しいタグ名")||"").trim();
    if(!t) return;
    if(!TAGSET.includes(t) && !(state.customTags||[]).includes(t)){
      state.customTags=[...(state.customTags||[]),t];
    }
    const arr=state.tags[id]||[];
    if(!arr.includes(t)) state.tags[id]=[...arr,t];
    save(); openDetail(id);
  });
  sheetEl.querySelectorAll(".chip[data-tag]").forEach(c=>c.addEventListener("click",()=>{
    const t=c.dataset.tag, arr=state.tags[id]||[];
    state.tags[id]=arr.includes(t)?arr.filter(x=>x!==t):[...arr,t];
    save(); c.classList.toggle("on");
  }));
  document.getElementById("wantT").addEventListener("click",e=>{
    state.wants=state.wants.includes(id)?state.wants.filter(x=>x!==id):[...state.wants,id];
    save(); e.target.classList.toggle("on"); renderList();
  });
  fillPhotos(sheetEl);
}
window.__maps=(lat,lng)=>window.open(`https://www.google.com/maps?q=${lat},${lng}`,"_blank");
window.__delFree=id=>{
  state.userFacilities=state.userFacilities.filter(f=>f.id!==id);
  state.visits=state.visits.filter(v=>v.facilityId!==id);
  state.wants=state.wants.filter(x=>x!==id);
  delete state.tags[id];
  save(); closeSheet(); renderAll(); notify("削除しました");
};

/* ---------- 台帳登録 ---------- */
function openAddFree(){
  openSheet(sheetHead("台帳に施設を登録")+`
    <label class="field"><div class="eyebrow">施設名</div><input class="input" id="af-name" placeholder="例：○○温泉"></label>
    <label class="field"><div class="eyebrow">場所・メモ（任意）</div><input class="input" id="af-city" placeholder="市町村、特徴など"></label>
    <div class="field"><div class="eyebrow">位置</div>
      <button class="btn" id="af-gps" style="width:100%">現在地を使う</button>
      <div class="mono" id="af-coord" style="font-size:11px;color:var(--ok);margin-top:8px"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <input class="input mono" id="af-lat" placeholder="緯度" inputmode="decimal" style="font-size:13px">
        <input class="input mono" id="af-lng" placeholder="経度" inputmode="decimal" style="font-size:13px">
      </div>
      <p class="settext" style="font-size:11.5px">現地でなければ地図アプリの座標を貼り付け。</p>
    </div>
    <button class="btn primary" style="width:100%" id="af-save">登録する</button>`);
  let coord=null;
  document.getElementById("af-gps").addEventListener("click",async e=>{
    e.target.disabled=true; e.target.textContent="測位中…";
    try{ const p=await getPosition(); coord={lat:p.lat,lng:p.lng}; lastPos=p;
      document.getElementById("af-coord").textContent=`${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;
    }catch(err){ notify(err.message,"err"); }
    e.target.disabled=false; e.target.textContent="現在地を使う";
  });
  document.getElementById("af-save").addEventListener("click",()=>{
    const name=document.getElementById("af-name").value.trim();
    const la=parseFloat(document.getElementById("af-lat").value), ln=parseFloat(document.getElementById("af-lng").value);
    const c=coord||( !isNaN(la)&&!isNaN(ln) ? {lat:la,lng:ln} : null);
    if(!name||!c){ notify("施設名と位置が必要です。","err"); return; }
    const f={id:"u"+uid(), name, city:document.getElementById("af-city").value.trim(), lat:c.lat, lng:c.lng};
    state.userFacilities.push(f); save(); closeSheet(); renderAll();
    notify(`${name} を台帳に登録しました`);
  });
}

/* ---------- チェックイン（4軸スライダー） ---------- */
window.__checkin=(id,method,dist)=>{
  const f=byId(id); if(!f) return;
  const prev=fScore(id);
  const init = prev && prev.v.axes ? {...prev.v.axes} : {sauna:20,water:20,rest:20,clean:20};
  openSheet(sheetHead("スタンプ — "+f.name)+`
    <div class="mono" style="font-size:10.5px;color:var(--muted);margin-bottom:14px">
      ${method==="gps"?`GPS判定 · ${dist}m`:"手動チェックイン"}</div>
    <label class="field"><div class="eyebrow">日付</div>
      <input class="input mono" type="date" id="ci-date" value="${today()}"></label>
    <div class="eyebrow" style="margin-bottom:10px">採点（各25点）</div>
    ${AXES.map(([k,label])=>`
      <div class="axis"><div class="slidelabel"><span style="color:var(--mid)">${label}</span><span id="ci-${k}-v">${init[k]}</span></div>
      <input type="range" min="0" max="25" value="${init[k]}" id="ci-${k}" style="accent-color:var(--text)"></div>`).join("")}
    <div class="axis"><div class="slidelabel"><span style="color:var(--mid)">特別加減点</span><span id="ci-adj-v">0</span></div>
      <input type="range" min="-10" max="10" value="0" id="ci-adj"></div>
    <input class="input" id="ci-adjr" placeholder="加減点の理由（例：混雑 −2）" style="font-size:13px;display:none;margin-bottom:6px">
    <div class="scoretotal" id="ci-total">80<small> /100±</small></div>
    <div class="axis"><div class="slidelabel"><span style="color:#C7973F">今日の整い</span><span id="ci-ttn-v">—</span></div>
      <input type="range" min="0" max="5" step="0.5" value="0" id="ci-ttn" style="accent-color:#C7973F"></div>
    <div class="tempsrow">
      <div><div class="slidelabel"><span style="color:var(--hot)">サウナ室</span><span id="ci-hot-v">90°C</span></div>
        <input type="range" min="50" max="130" value="90" id="ci-hot" style="accent-color:var(--hot)"></div>
      <div><div class="slidelabel"><span style="color:var(--cold)">水風呂</span><span id="ci-cold-v">16°C</span></div>
        <input type="range" min="2" max="30" value="16" id="ci-cold" style="accent-color:var(--cold)"></div>
    </div>
    <label class="field"><div class="eyebrow">メモ</div>
      <textarea class="input" id="ci-memo" placeholder="ととのい方、導線、音、匂い"></textarea></label>
    <div class="field"><div class="eyebrow">写真</div>
      <input type="file" id="ci-photos" accept="image/*" multiple style="margin-top:6px;font-size:12px;color:var(--muted)">
    </div>
    <button class="btn primary" style="width:100%" id="ci-save">スタンプを押す</button>`);

  const upd=()=>{
    let t=0;
    for(const [k] of AXES){ const v=+document.getElementById("ci-"+k).value; t+=v; document.getElementById("ci-"+k+"-v").textContent=v; }
    const adj=+document.getElementById("ci-adj").value;
    document.getElementById("ci-adj-v").textContent=(adj>0?"+":"")+adj;
    document.getElementById("ci-adjr").style.display = adj!==0 ? "block" : "none";
    document.getElementById("ci-total").innerHTML=(t+adj)+`<small> /100±</small>`;
  };
  for(const [k] of AXES) document.getElementById("ci-"+k).addEventListener("input",upd);
  document.getElementById("ci-adj").addEventListener("input",upd);
  upd();
  document.getElementById("ci-hot").addEventListener("input",e=>document.getElementById("ci-hot-v").textContent=e.target.value+"°C");
  document.getElementById("ci-cold").addEventListener("input",e=>document.getElementById("ci-cold-v").textContent=e.target.value+"°C");
  document.getElementById("ci-ttn").addEventListener("input",e=>{
    const v=+e.target.value;
    document.getElementById("ci-ttn-v").textContent = v>0 ? "★"+v : "—";
  });
  document.getElementById("ci-save").addEventListener("click",async e=>{
    e.target.disabled=true; e.target.textContent="保存中…";
    const adj=+document.getElementById("ci-adj").value;
    const adjReason=document.getElementById("ci-adjr").value.trim();
    if(adj!==0 && !adjReason){ notify("加減点には理由を一言。","err"); e.target.disabled=false; e.target.textContent="スタンプを押す"; return; }
    const photoIds=[];
    const files=document.getElementById("ci-photos").files;
    try{
      for(const file of files){
        const blob=await compress(file);
        const pid="p"+uid();
        await photoPut(pid,blob); photoIds.push(pid);
      }
    }catch(err){ notify("写真の保存に失敗しました（記録は保存します）。","err"); }
    const axes={}; for(const [k] of AXES) axes[k]=+document.getElementById("ci-"+k).value;
    const first=!stamped().has(id);
    const vdate=document.getElementById("ci-date").value||today();
    state.visits.unshift({
      id:uid(), facilityId:id, date:vdate, method,
      axes, adj, adjReason, totonoi:(+document.getElementById("ci-ttn").value)||null,
      hot:+document.getElementById("ci-hot").value, cold:+document.getElementById("ci-cold").value,
      memo:document.getElementById("ci-memo").value.trim(), photos:photoIds
    });
    save(); closeSheet(); renderAll();
    stampFx(f.name, vdate);
    if(first && f.pref){
      const n=FRAME.filter(x=>x.pref===f.pref&&stamped().has(x.id)).length;
      notify(n===10?`${PREF[f.pref].label} 県制覇！ 10/10`:`初スタンプ。${PREF[f.pref].label} ${n}/10`);
    } else notify(first?"台帳に初スタンプ。":"再訪を記録しました");
  });
};

/* ---------- GPSスタンプ ---------- */
document.getElementById("stampBtn").addEventListener("click",async()=>{
  const btn=document.getElementById("stampBtn");
  btn.disabled=true; btn.textContent="測位中…";
  try{
    const p=await getPosition();
    lastPos=p; renderMap();
    const pool=allFacilities();
    const near=pool.map(f=>({f,d:distance(p,f)})).filter(x=>x.d<=state.radius).sort((a,b)=>a.d-b.d);
    if(!near.length){
      const c=pool.map(f=>({f,d:distance(p,f)})).sort((a,b)=>a.d-b.d)[0];
      notify(`半径${state.radius}m以内に登録施設なし。最寄りは ${c.f.name}（${fmtDist(c.d)}）。枠外なら施設タブ→台帳に登録を。`,"err");
    } else if(near.length===1){
      window.__checkin(near[0].f.id,"gps",Math.round(near[0].d));
    } else {
      openSheet(sheetHead("どの施設にいますか？")+near.map(x=>
        `<button class="choosebtn" onclick="window.__checkin('${x.f.id}','gps',${Math.round(x.d)})">
         <span>${esc(x.f.name)}</span><span class="d">${Math.round(x.d)}m</span></button>`).join(""));
    }
  }catch(e){ notify(e.message,"err"); }
  btn.disabled=false; btn.textContent="現在地でスタンプ";
});

/* ---------- タブ・設定 ---------- */
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="pane-"+tab));
}));
const radEl=document.getElementById("radius");
radEl.value=state.radius;
const radLabel=()=>document.getElementById("radlabel").textContent=`GPS判定半径 — ${state.radius}m`;
radLabel();
radEl.addEventListener("input",()=>{state.radius=+radEl.value;radLabel();save();});

/* ---------- バックアップ（写真込み） ---------- */
document.getElementById("exportBtn").addEventListener("click",async()=>{
  notify("書き出し中…");
  const photos=[];
  try{
    const keys=await photoAllKeys();
    for(const k of keys){
      const b=await photoGet(k);
      if(!b) continue;
      const dataUrl=await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); });
      photos.push({id:k,dataUrl});
    }
  }catch(e){}
  const blob=new Blob([JSON.stringify({state,photos})],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`sauna30-backup-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  notify(`書き出しました（写真${photos.length}枚込み）`);
});
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.state||!Array.isArray(d.state.visits)) throw new Error();
      state=Object.assign({userFacilities:[],visits:[],wants:[],tags:{},customTags:[],radius:300}, d.state);
      save();
      if(Array.isArray(d.photos)){
        for(const p of d.photos){
          const res=await fetch(p.dataUrl); const b=await res.blob();
          await photoPut(p.id,b);
        }
      }
      radEl.value=state.radius; radLabel(); renderAll();
      notify(`読み込み完了。${state.visits.length}件の記録を復元しました`);
    }catch{ notify("読み込めませんでした。書き出したファイルを選んでください。","err"); }
  };
  r.readAsText(file); e.target.value="";
});

renderAll();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
